name: Dog Tag Day Free Broadcast Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live Dog Tag Day publisher
        run: |
          set -e
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now
