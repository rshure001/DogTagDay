name: Browser Map Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-map-test.yml'
jobs:
  browser-map-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/map-browser
          cd /tmp/map-browser
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live homepage map in real Chromium
        run: |
          cd /tmp/map-browser
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://dogtagday.org/?mapverify='+Date.now(),{waitUntil:'networkidle'});
            const section=page.locator('#reach-across-america');
            await section.waitFor({state:'visible',timeout:20000});
            const text=await section.innerText();
            if(!text.includes('1,800 outreach lights across America.')) throw new Error('Homepage map heading missing');
            const frame=page.frameLocator('#dogtag-outreach-map');
            await frame.locator('#map').waitFor({state:'visible',timeout:20000});
            await frame.locator('.leaflet-interactive').first().waitFor({state:'visible',timeout:20000});
            const lights=await frame.locator('.leaflet-interactive').count();
            if(lights < 1800) throw new Error('Expected at least 1800 map lights, got '+lights);
            await section.screenshot({path:'/tmp/map-browser/live-map.png'});
            console.log('LIVE_HOMEPAGE_MAP_VISIBLE=true');
            console.log('LIVE_MAP_LIGHTS='+lights);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test.js
      - name: Upload map screenshot
        uses: actions/upload-artifact@v4
        with:
          name: live-map-screenshot
          path: /tmp/map-browser/live-map.png
