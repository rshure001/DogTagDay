name: Emergency Fix Broken Hero
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-fix-broken-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken hero asset and verify source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/dog-tag-day-five-no-hats.webp?v=20260831b','assets/dogtagday-no-hats-final.jpg?v=20260831-fixed')
          s=s.replace('data-dtd-build="2026-08-31-banner-below-mission"','data-dtd-build="2026-08-31-broken-image-fixed"')
          p.write_text(s)
          PY
          grep -q 'assets/dogtagday-no-hats-final.jpg?v=20260831-fixed' index.html
          grep -q 'data-dtd-build="2026-08-31-broken-image-fixed"' index.html
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Fix broken homepage hero image'
            git push origin main
          fi
