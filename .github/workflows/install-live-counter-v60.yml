name: Install Live Counter v60
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'Install live counter workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch homepage counter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('2026-09-17-final-v59','2026-09-17-final-v60')
          s=s.replace('v=20260917-v59','v=20260917-v60')
          s=s.replace('<strong>4,892</strong>VISITORS TO DOGTAGDAY.ORG','<strong id="visitorCount">4,892</strong>VISITORS TO DOGTAGDAY.ORG')
          script='''<script>(function(){const el=document.getElementById('visitorCount');if(!el)return;fetch('https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtagday-counter',{method:'GET',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('counter');return r.json()}).then(d=>{const n=Number(d.value);if(Number.isFinite(n))el.textContent=n.toLocaleString('en-US')}).catch(()=>{});})();</script>'''
          if 'dogtagday-counter' not in s:
              s=s.replace('</body>',script+'</body>')
          p.write_text(s)
          PY
      - name: Commit live counter
        run: |
          git config user.name rshure001
          git config user.email rshure001@yahoo.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install live counter v60'
          git push
