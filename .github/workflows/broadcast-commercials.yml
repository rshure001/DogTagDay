name: Dog Tag Day Commercial Broadcast — Super House Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/broadcast-commercials.yml'
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  trigger-super-house:
    name: "Trigger Super House Relay"
    runs-on: ubuntu-latest
    steps:
      - name: Get short-lived relay identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)" "$RESPONSE")"
          echo "DOGTAG_RELAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Queue all three approved commercials
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -X POST -H "Authorization: Bearer ${DOGTAG_RELAY_TOKEN}" -H "content-type: application/json" --data '{"commercials":["commercial-1","commercial-2","commercial-3"]}' https://dog-tag-day-super-house.workers.dev/api/relay)"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok": true'
          echo "RELAY_ACCEPTED=true"
