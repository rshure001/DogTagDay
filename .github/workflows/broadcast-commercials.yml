name: Dog Tag Day Commercial Broadcast — Direct Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/broadcast-commercials.yml'
      - '.github/workflows/dog-tag-day-broadcast-trigger.txt'

permissions:
  contents: read

jobs:
  publish-approved-commercials:
    name: "Publish all three approved commercials"
    runs-on: ubuntu-latest
    steps:
      - name: Publish Commercial 1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -X POST             -H "content-type: application/json"             https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now

      - name: Publish Commercial 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -X POST             -H "content-type: application/json"             https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now

      - name: Publish Commercial 3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -X POST             -H "content-type: application/json"             https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now
