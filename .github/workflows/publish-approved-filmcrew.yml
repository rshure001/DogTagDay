name: Publish Approved Film Crew Scene

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved homepage changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('2026-09-17-final-v54','2026-09-17-final-v55')
          s = s.replace('https://gcdn.picsart.com/editing-temp/4d5c067c-ef79-4719-b828-71dd2b4a15ba.jpeg?v=20260917-v54','https://gcdn.picsart.com/editing-temp/c2200d6b-22c0-4502-ac19-e142f202f921.png?v=20260917-v55')
          s = s.replace('<strong>4,300+</strong>VISITORS TO DOGTAGDAY.ORG','<strong>4,892</strong>VISITORS TO DOGTAGDAY.ORG')
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'rshure001'
          git config user.email 'rshure001@yahoo.com'
          git add index.html
          git commit -m 'Publish approved film crew scene and 4892 counter'
          git push origin main
