name: Finish Homepage Partners
on:
  push:
    paths:
      - '.github/workflows/finish-homepage-partners.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace hero with clean rebuilt image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          b64=''
          new='data:image/webp;base64,'+b64
          s=re.sub(r'(<section class="hero[^>]*><img[^>]*src=")data:image/webp;base64,[^"]+("[^>]*>)',r'\1'+new+r'\2',s,count=1)
          s=re.sub(r'data-dtd-build="[^"]+"','data-dtd-build="2026-08-31-rebuilt-clean-hero"',s,count=1)
          p.write_text(s)
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace broken screenshot hero with rebuilt clean hero"
          git push
