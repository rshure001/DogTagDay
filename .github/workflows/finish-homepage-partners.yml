name: Finish Homepage Partners
on:
  push:
    paths:
      - '.github/workflows/finish-homepage-partners.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force partnership section visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''.partnerBand{display:block!important;visibility:visible!important;opacity:1!important;max-width:1180px;margin:0 auto 58px;padding:28px 20px;text-align:center}.partnerPanel{display:block!important;border:1px solid #8f753c;background:#0a1a28;padding:28px 20px}.partnerPanel h3{margin:0 0 8px;font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.5rem);color:#fff}.partnerPanel p{margin:0 auto 18px;max-width:850px}.partnerTypes{display:flex!important;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 0 20px}.partnerTypes span{display:inline-block;border:1px solid #8f753c;border-radius:999px;padding:8px 12px;color:#dfba62;font-size:.78rem;font-weight:900}.partnerPanel .btn{display:inline-block}@media(max-width:760px){.partnerBand{padding:22px 12px 30px}.partnerPanel{padding:22px 14px}.partnerTypes{gap:7px}.partnerTypes span{font-size:.68rem;padding:7px 9px}}'''
          if css not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          partner='''<section class="partnerBand" aria-label="Partner with Dog Tag Day"><div class="partnerPanel"><div class="eyebrow">Stand With Those Who Served</div><h3>Partner With Dog Tag Day</h3><p>We welcome organizations and communities that want to help make military service visible on April 18.</p><div class="partnerTypes"><span>SPONSORS</span><span>CHARITIES</span><span>VETERANS ORGANIZATIONS</span><span>COMMUNITY PARTNERS</span><span>VOLUNTEERS</span><span>MEDIA</span></div><a class="btn primary" href="#contact">Become a Partner</a></div></section>'''
          if 'aria-label="Partner with Dog Tag Day"' not in s:
              needle='<section class="section dark" id="stories">'
              s=s.replace(needle,partner+needle,1)
          s=s.replace('href="contact.html">Become a Partner','href="#contact">Become a Partner')
          p.write_text(s)
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force partnership section visible on homepage"
          git push
