name: Dog Tag Day Commercial Trigger

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/dog-tag-day-publish-now"
  schedule:
    - cron: "0 8,13,18 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dogtag-browser")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger owned Dog Tag Day publisher
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2 --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"commercials":["commercial-1","commercial-2","commercial-3"]}' \
            "https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtag-publish-now")"
          echo "$RESPONSE"
          python -c 'import json,sys; x=json.load(sys.stdin); sys.exit(0 if x.get("ok") is True else 2)' <<< "$RESPONSE"
