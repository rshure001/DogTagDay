name: Publish v30 Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Launch v30 repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair homepage and deployment checks
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('index.html'),
              Path('.github/workflows/deploy-pages-now.yml'),
              Path('.github/workflows/verify-live-homepage.yml'),
          ]
          for p in files:
              s = p.read_text()
              s = s.replace('2026-09-17-final-v29','2026-09-17-final-v30')
              s = s.replace('dog-tag-day-five-no-hats.webp','swipe-page2.jpg')
              s = s.replace('20260917-v29','20260917-v30')
              s = s.replace('homepage v29','homepage v30')
              s = s.replace('HOMEPAGE_V29','HOMEPAGE_V30')
              s = s.replace('proof-v29','proof-v30')
              p.write_text(s)
          PY
          grep -q '2026-09-17-final-v30' index.html
          grep -q 'assets/swipe-page2.jpg?v=20260917-v30' index.html
          ! grep -q 'dog-tag-day-five-no-hats.webp' index.html
          grep -q '2026-09-17-final-v30' .github/workflows/deploy-pages-now.yml
          grep -q 'swipe-page2.jpg' .github/workflows/deploy-pages-now.yml
          grep -q '2026-09-17-final-v30' .github/workflows/verify-live-homepage.yml
          grep -q 'swipe-page2.jpg' .github/workflows/verify-live-homepage.yml
      - name: Commit v30 repair
        run: |
          git config user.name 'rshure001'
          git config user.email 'rshure001@yahoo.com'
          git add index.html .github/workflows/deploy-pages-now.yml .github/workflows/verify-live-homepage.yml
          git commit -m 'Publish v30 verified repair'
          git push origin HEAD:main
