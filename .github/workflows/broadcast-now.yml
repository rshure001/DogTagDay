name: Dog Tag Day — Broadcast Now (Owned Control Plane)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/broadcast-now-trigger.txt'

permissions:
  contents: read
  id-token: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Get short-lived Dog Tag Day runtime identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$RESPONSE")"
          echo "DOGTAG_RUNTIME_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Queue approved commercials on authorized platforms
        shell: bash
        env:
          SUPER_HOUSE: https://dog-tag-day-super-house.juvenile-lemming.workers.dev
        run: |
          set -euo pipefail
          for COMMERCIAL in commercial-1 commercial-2 commercial-3; do
            curl -fsS --retry 3 --retry-delay 2 \
              -X POST "$SUPER_HOUSE/api/queue" \
              -H "Authorization: Bearer $DOGTAG_RUNTIME_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{"commercial":"$COMMERCIAL","platforms":["facebook","instagram","youtube"]}"
            echo
          done
