name: Dog Tag Day — Broadcast Now (Owned Direct Publisher)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/broadcast-now-trigger.txt'

permissions:
  contents: write
  id-token: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Get short-lived Dog Tag Day runtime identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$RESPONSE")"
          echo "DOGTAG_RUNTIME_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish all three approved commercials through owned direct publisher
        shell: bash
        env:
          PUBLISHER: https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtag-publish-now
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --retry 3 --retry-delay 2 -o /tmp/dtd-result.json -w '%{http_code}'             -X POST "$PUBLISHER"             -H "Authorization: Bearer $DOGTAG_RUNTIME_TOKEN"             -H "Content-Type: application/json"             --data '{"commercials":["commercial-1","commercial-2","commercial-3"]}')"
          cat /tmp/dtd-result.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/dtd-result.json","utf8")); fs.writeFileSync("/tmp/dtd-result-safe.json",JSON.stringify({recorded_at:new Date().toISOString(),http_code:Number(process.argv[1]),result:x},null,2));' "$HTTP_CODE"

      - name: Record execution result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT="$(base64 -w0 /tmp/dtd-result-safe.json)"
          URL="https://api.github.com/repos/rshure001/DogTagDay/contents/broadcast-result.json"
          EXISTING="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$URL")"
          SHA="$(node -e 'let x=JSON.parse(process.argv[1]); process.stdout.write(x.sha||"")' "$EXISTING")"
          BODY="$(node -e 'const x={message:"Record owned direct broadcast execution result",content:process.argv[1],branch:"main"}; if(process.argv[2])x.sha=process.argv[2]; process.stdout.write(JSON.stringify(x));' "$CONTENT" "$SHA")"
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "$URL" --data "$BODY"
