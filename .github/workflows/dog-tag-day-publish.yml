name: Dog Tag Day — Publish Next Commercial

on:
  workflow_dispatch:
  push:
    paths:
      - ".dispatch/publish-now"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Execute live Dog Tag Day publisher
        run: |
          set -e
          echo "Calling live Dog Tag Day publishing engine..."
          RESPONSE=$(curl --fail --show-error --silent --location --request GET             "https://api-v2.appdeploy.ai/app/dog-tag-day-broadcast-control-trpgv6/api/direct/run-now")
          echo "$RESPONSE"
      - name: Verify engine status
        run: |
          curl --fail --show-error --silent             "https://api-v2.appdeploy.ai/app/dog-tag-day-kwai-bridge-awybdm/api/status"
          echo