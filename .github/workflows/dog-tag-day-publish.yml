name: Dog Tag Day — Publish Next Commercial

on:
  workflow_dispatch:
  push:
    paths:
      - ".dispatch/publish-now"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Execute live Dog Tag Day publisher
        run: |
          set -e
          echo "Calling live Dog Tag Day publishing engine..."
          RESPONSE=$(curl --fail --show-error --silent --request POST             --header "Content-Type: application/json"             --data '{}'             "https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now")
          echo "$RESPONSE"
      - name: Verify engine status
        run: |
          curl --fail --show-error --silent             "https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/status"
          echo