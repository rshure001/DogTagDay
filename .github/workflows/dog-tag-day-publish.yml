name: Dog Tag Day — Publish Next Commercial

on:
  workflow_dispatch:
  push:
    paths:
      - ".dispatch/publish-now"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dog Tag Day direct publisher
        shell: bash
        run: |
          set -euo pipefail
          echo "Calling Dog Tag Day direct publisher for the next commercial..."
          RESPONSE="$(curl -sS --retry 3 --retry-delay 2 \\
            -X POST \\
            -H "Content-Type: application/json" \\
            --data '{}' \\
            "https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now")"
          echo "$RESPONSE"
          node -e 'const x=JSON.parse(process.argv[1]); if (x && x.error) process.exit(2)' "$RESPONSE"
