name: Dog Tag Day Browser Round Trip Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dogtag-browser-roundtrip-test.yml"
      - "super-house-worker.js"
      - "browser/runtime-worker/src/index.ts"

permissions:
  contents: read
  id-token: write

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPER_HOUSE_URL: https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtag-browser-runtime
    steps:
      - name: Obtain GitHub-signed runtime identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)" "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "DOGTAG_RUNTIME_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Enqueue a read-only browser status command
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            CODE="$(curl -sS -o "$RUNNER_TEMP/enqueue.json" -w "%{http_code}" -X POST "$SUPER_HOUSE_URL?op=test-command" \
              -H "x-dogtag-runtime-token: $DOGTAG_RUNTIME_TOKEN" \
              -H "content-type: application/json" \
              --data '{"action":"status"}' || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          if [ "${CODE:-}" != "200" ]; then
            cat "$RUNNER_TEMP/enqueue.json" || true
            echo "Could not enqueue status command; HTTP ${CODE:-none}" >&2
            exit 1
          fi
          ID="$(node -e "const x=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!x.ok||!x.id) process.exit(2); process.stdout.write(x.id)" "$RUNNER_TEMP/enqueue.json")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the browser worker result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.enqueue.outputs.id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            CODE="$(curl -sS -o "$RUNNER_TEMP/result.json" -w "%{http_code}" \
              "$SUPER_HOUSE_URL?op=test-result&id=$COMMAND_ID" \
              -H "Authorization: Bearer $DOGTAG_RUNTIME_TOKEN" || true)"
            if [ "$CODE" = "200" ]; then
              STATE="$(node -e "const x=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); process.stdout.write(x.state==='done'?'done':x.state==='failed'?'failed':'pending')" "$RUNNER_TEMP/result.json")"
              if [ "$STATE" = "done" ]; then
                node -e "const x=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const r=x.result; if(!r||typeof r.url!=='string'||typeof r.title!=='string') process.exit(2); console.log(JSON.stringify({ok:true,url:r.url,title:r.title,commandId:x.id}))" "$RUNNER_TEMP/result.json"
                echo "Browser command round trip verified."
                exit 0
              elif [ "$STATE" = "failed" ]; then
                cat "$RUNNER_TEMP/result.json"
                exit 1
              fi
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/result.json" || true
          echo "Timed out waiting for browser command result." >&2
          exit 1