name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify current source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s map-golden-1850.html
          grep -q 'data-dtd-build="2026-08-31-five-vets-upright"' index.html
          grep -q 'href="#outreach">Across America</a>' index.html
          grep -q 'Nationwide Outreach' index.html
          grep -q 'dog-tag-day-five-no-hats.webp' index.html
          ! grep -q '1,850+ Outreach Lights' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production HTML
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?build=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-31-five-vets-upright"' \
              && printf '%s' "$html" | grep -q 'Nationwide Outreach' \
              && printf '%s' "$html" | grep -q 'dog-tag-day-five-no-hats.webp' \
              && ! printf '%s' "$html" | grep -q '1,850+ Outreach Lights'; then
              echo LIVE_HOMEPAGE_VERIFIED
              exit 0
            fi
            sleep 5
          done
          echo 'Production did not update to current build' >&2
          exit 1
