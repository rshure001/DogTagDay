name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-restored-homepage
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Force fresh holiday mascot loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'music-player\.js\?v=[^"\']+', 'music-player.js?v=20260830HOLIDAYSTATIC3', s)
          p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live holiday loader
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            js=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/music-player.js?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'music-player.js?v=20260830HOLIDAYSTATIC3' \
              && printf '%s' "$js" | grep -q 'DTD_HOLIDAY_STATIC_V3' \
              && printf '%s' "$js" | grep -q 'bottom:18px' \
              && printf '%s' "$js" | grep -q 'bottom:14px'; then
              echo 'LIVE_HOLIDAY_STATIC_V3_BOTTOM_RIGHT_VERIFIED'
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
