name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s map-golden-1850.html
          grep -q 'data-dtd-build="2026-08-31-hero-hardfix"' index.html
          grep -q 'raw.githubusercontent.com/rshure001/DogTagDay/main/assets/approved-dog-tags.PNG' index.html
          grep -q 'Nationwide Outreach' index.html
          curl -fsSLI --retry 3 'https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/approved-dog-tags.PNG' | grep -qi 'content-type: image'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?hardfix=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-31-hero-hardfix"' \
              && printf '%s' "$html" | grep -q 'raw.githubusercontent.com/rshure001/DogTagDay/main/assets/approved-dog-tags.PNG' \
              && printf '%s' "$html" | grep -q 'Nationwide Outreach'; then
              curl -fsSLI --retry 3 'https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/approved-dog-tags.PNG' | grep -qi 'content-type: image'
              echo LIVE_HOMEPAGE_AND_HERO_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
