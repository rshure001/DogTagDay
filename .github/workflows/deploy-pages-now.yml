name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate v13 homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-live-fix-v13' index.html
          grep -q 'assets/dog-tag-day-hero.PNG' index.html
          grep -q 'assets/combat-team-final.jpg' index.html
          grep -q 'assets/dogtagday-no-hats-final.jpg' index.html
          grep -q 'DIFFERENT PATHS • THE SAME PURPOSE' index.html
          grep -q 'assets/camera-crew-final.jpg' index.html
          grep -q 'ronnie-street-conversation-final.jpg' index.html
          grep -q 'ronnie-shure-founder-20260901.jpg' index.html
          grep -q 'ronnie-community-support.jpg' index.html
          grep -q '4,817' index.html
          grep -q 'HALLOWEEN' index.html
          grep -q 'Donate Through the Honor Jar' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
