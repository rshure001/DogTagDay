name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate current homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-final-homepage-v9' index.html
          grep -q 'assets/dog-tag-day-hero.PNG' index.html
          grep -q 'Veterans should not become invisible' index.html
          grep -q 'NO MAN LEFT BEHIND' index.html
          grep -q 'THE UNIFORM COMES OFF' index.html
          grep -q 'Ronnie Shure — Founder' index.html
          grep -q '4,817' index.html
          grep -q 'Donate Through the Honor Jar' index.html
          grep -q 'Open Letter to President Donald J. Trump' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
