name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify image-safe homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-15-image-safe' index.html
          grep -q 'Identity • Brotherhood • Honor' index.html
          grep -q 'dog-tag-day-realistic-veterans-20260901.jpg' index.html
          grep -q 'camera-crew-approved-20260915.svg' index.html
          grep -q 'ronnie-founder-natural-facial-hair-20260903.jpg' index.html
          file assets/dog-tag-day-realistic-veterans-20260901.jpg | grep -qi 'JPEG image data'
          file assets/ronnie-founder-natural-facial-hair-20260903.jpg | grep -qi 'JPEG image data'
          grep -q '<svg' assets/camera-crew-approved-20260915.svg
          file assets/dog-tag-day-national-map-brighter-20260913.jpg | grep -qi 'JPEG image data'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production homepage
        run: |
          set -e
          for i in $(seq 1 36); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q '2026-09-15-image-safe'; then
              echo LIVE_IMAGE_SAFE_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
