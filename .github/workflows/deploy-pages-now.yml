name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace broken What We Do image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('assets/camera-crew-final.jpg?v=20260916', 'assets/dogtagday-no-hats-final.jpg?v=20260916-work-safe')
          s = s.replace('Camera crew documenting a veteran story', 'Veterans and community together')
          p.write_text(s)
          PY
      - name: Verify homepage exists
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-original-hero-working-sliders' index.html
          grep -q 'dog-tag-day-hero.PNG' index.html
          grep -q 'dogtagday-no-hats-final.jpg?v=20260916-work-safe' index.html
          ! grep -q 'camera-crew-final.jpg' index.html
          grep -q 'peopleSlider' index.html
          grep -q 'workSlider' index.html
          grep -q 'id="visitCount">4,300' index.html
          grep -q 'VISITS TO DOGTAGDAY.ORG' index.html
          grep -q 'NEXT HOLIDAY:' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
