name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate final v24 homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-final-v24' index.html
          grep -q 'assets/dog-tag-day-hero.PNG' index.html
          grep -q 'assets/combat-inline-v2.svg' index.html
          grep -q 'assets/dog-tag-day-realistic-veterans-20260901.jpg' index.html
          grep -q 'assets/bbq-inline.svg' index.html
          grep -q 'assets/camera-crew-approved-20260915.svg' index.html
          grep -q 'ronnie-street-conversation-final.jpg' index.html
          grep -q 'ronnie-shure-founder-20260901.jpg' index.html
          grep -q '4,817' index.html
          grep -q 'HALLOWEEN' index.html
          ! grep -q 'rotate(90deg)' index.html
          test -s assets/combat-inline-v2.svg
          test -s assets/bbq-inline.svg
          test -s assets/camera-crew-approved-20260915.svg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
