name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source
        run: |
          set -e
          test -s index.html
          test -s map-golden-1850.html
          test -s map-vector.html
          grep -q 'data-dtd-build="2026-08-31-visual-repair"' index.html
          grep -q 'approved-dog-tags.PNG' index.html
          grep -q 'Nationwide Outreach' index.html
          grep -q 'Partner With Dog Tag Day' index.html
          grep -q 'map-vector.html' map-golden-1850.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production
        run: |
          set -e
          for i in $(seq 1 36); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-31-visual-repair"' && printf '%s' "$html" | grep -q 'approved-dog-tags.PNG' && printf '%s' "$html" | grep -q 'Nationwide Outreach'; then
              echo LIVE_HOMEPAGE_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
