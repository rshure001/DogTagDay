name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare verified homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-final-picture-fix' index.html
          grep -q 'dog-tag-day-hero.PNG' index.html
          grep -q 'dog-tag-day-realistic-veterans-20260901.jpg' index.html
          grep -q 'ronnie-founder-natural-facial-hair-20260903.jpg' index.html
          grep -q 'ronnie-shure-founder-20260901.jpg' index.html
          ! grep -q 'camera-crew-final.jpg' index.html
          grep -q 'peopleSlider' index.html
          grep -q 'workSlider' index.html
          grep -q 'letter-to-president.html' index.html
          grep -q 'id="visitCount">4,300' index.html
          grep -q 'VISITS TO DOGTAGDAY.ORG' index.html
          grep -q 'id="holidayTicker"' index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          override='''<script id="holiday-final-override">(function(){const t=document.getElementById('holidayTicker');if(!t)return;const n=new Date(),y=n.getFullYear();const nth=(Y,M,W,N)=>{const d=new Date(Y,M,1),a=(7+W-d.getDay())%7;return new Date(Y,M,1+a+7*(N-1),23,59,59)};const dates=[{d:new Date(2026,9,31,23,59,59),l:'🎃 HALLOWEEN • OCTOBER 31'},{d:new Date(2026,10,11,23,59,59),l:'🇺🇸 VETERANS DAY • NOVEMBER 11'},{d:nth(2026,10,4,4),l:'🦃 THANKSGIVING'},{d:new Date(2026,11,7,23,59,59),l:'⚓ PEARL HARBOR DAY • DECEMBER 7'},{d:new Date(2026,11,25,23,59,59),l:'🎄 CHRISTMAS • DECEMBER 25'},{d:new Date(2027,0,1,23,59,59),l:"🎆 NEW YEAR'S DAY • JANUARY 1"},{d:nth(2027,0,1,3),l:'✊ MLK DAY'},{d:nth(2027,1,1,3),l:'🏛️ PRESIDENTS DAY'},{d:new Date(2027,3,18,23,59,59),l:'🏷️ DOG TAG DAY • APRIL 18'}].filter(x=>x.d>=n).sort((a,b)=>a.d-b.d);if(dates[0])t.innerHTML='<span class="tickerItem"><strong>NEXT HOLIDAY:</strong> '+dates[0].l+'</span>';})();</script>'''
          s=s.replace('</body>',override+'\n</body>')
          p.write_text(s)
          PY
          grep -q 'holiday-final-override' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}