name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-restored-homepage
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy president preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact live homepage build
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://dogtagday.org/?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            css=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://dogtagday.org/styles.css?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            map=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://dogtagday.org/map-golden-1850.html?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-30-president-preview"' \
              && printf '%s' "$html" | grep -q '1,850+ Outreach Lights' \
              && printf '%s' "$html" | grep -q 'map-golden-1850.html?v=20260830PRESIDENT2' \
              && printf '%s' "$html" | grep -q '>Sponsors<' \
              && printf '%s' "$html" | grep -q '>Donations<' \
              && printf '%s' "$html" | grep -q '>Partnerships<' \
              && printf '%s' "$css" | grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' \
              && printf '%s' "$map" | grep -q '1,850+'; then
              echo 'LIVE_GOLDEN_1850_HORIZONTAL_SUPPORT_VERIFIED'
              ok=1
              break
            fi
            echo "Waiting for golden 1,850+ president preview... attempt $i"
            sleep 10
          done
          test "$ok" -eq 1
