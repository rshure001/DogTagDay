name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build approved live homepage
        run: |
          set -e
          test -s index.html
          mkdir -p assets
          cat .imageparts/rv1.01 .imageparts/rv1.02 .imageparts/rv1.03 | base64 -d > assets/ronnie-listening-veteran.jpg
          cat .imageparts/rv3m.01 .imageparts/rv3m.02 | base64 -d > assets/ronnie-community-support.jpg
          file assets/ronnie-listening-veteran.jpg | grep -qi 'JPEG image data'
          file assets/ronnie-community-support.jpg | grep -qi 'JPEG image data'
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Counter: compact, quiet, exact 4,062 with no plus sign.
          s=s.replace('.visitorCounter{padding:26px 18px;border:3px solid var(--gold);border-radius:10px;background:linear-gradient(145deg,#102947,#071426);box-shadow:inset 0 0 0 2px #fff}',
                      '.visitorCounter{width:min(300px,84vw);margin:0 auto;padding:8px 12px;border:1px solid #7e6a38;border-radius:7px;background:#0b1d33;box-shadow:none}')
          s=s.replace('.visitorCounter strong{display:block;font:900 clamp(3rem,15vw,6rem)/.9 Georgia,serif}',
                      '.visitorCounter strong{display:block;font:900 clamp(1.55rem,7vw,2.1rem)/1 Georgia,serif}')
          s=s.replace('.visitorCounter span{display:block;color:var(--gold);font-weight:900;letter-spacing:.1em;margin-top:10px}',
                      '.visitorCounter span{display:block;color:#aeb8c4;font-weight:700;letter-spacing:.06em;margin-top:3px;font-size:.58rem}')
          s=s.replace('<strong id="visitCount">4,300</strong>','<strong id="visitCount">4,062</strong>')
          s=s.replace('<strong id="visitCount">4300</strong>','<strong id="visitCount">4,062</strong>')
          s=re.sub(r"\(function\(\)\{const el=document\.getElementById\('visitCount'\).*?\}\)\(\);",
                   "(function(){const el=document.getElementById('visitCount');if(el)el.textContent='4,062';})();",
                   s, count=1, flags=re.S)

          # Approved photo order: listening first, community/camera-support second.
          people = '''<div class="slider" id="peopleSlider"><figure class="slide"><img src="assets/ronnie-listening-veteran.jpg?v=20260916-approved" alt="Founder sitting face to face with a veteran and listening"><figcaption>SIT DOWN • HEAR THE STORY • STAY WITH THEM</figcaption></figure><figure class="slide"><img src="assets/ronnie-community-support.jpg?v=20260916-approved" alt="Founder beside a veteran while the story is documented"><figcaption>REAL SUPPORT • REAL PEOPLE • REAL COMMUNITY</figcaption></figure></div>'''
          s=re.sub(r'<div class="slider" id="peopleSlider">.*?</div><div class="sliderBtns">', people+'<div class="sliderBtns">', s, count=1, flags=re.S)

          work = '''<div class="slider" id="workSlider"><figure class="slide"><img src="assets/ronnie-community-support.jpg?v=20260916-approved" alt="Founder beside a veteran with the camera crew documenting the conversation"><figcaption>WE SHOW UP • WE LISTEN • WE STAY</figcaption></figure><figure class="slide"><img src="assets/ronnie-listening-veteran.jpg?v=20260916-approved" alt="Founder listening face to face with a veteran"><figcaption>PERSON TO PERSON • HEAR THE STORY</figcaption></figure></div>'''
          s=re.sub(r'<div class="slider" id="workSlider">.*?</div><div class="sliderBtns">', work+'<div class="sliderBtns">', s, count=1, flags=re.S)

          # Founder image stays only in Founder section; use the older/greyer approved portrait.
          s=re.sub(r'(<section id="founder".*?<div class="founderPortrait"><img src=")[^"]+("[^>]*>)',
                   r'\1assets/ronnie-shure-founder-20260902-older-gray.png?v=20260916-founder\2', s, count=1, flags=re.S)

          # Next-holiday strip.
          override='''<script id="holiday-final-override">(function(){const t=document.getElementById('holidayTicker');if(!t)return;const n=new Date();const dates=[{d:new Date(2026,9,31,23,59,59),l:'🎃 HALLOWEEN • OCTOBER 31'},{d:new Date(2026,10,11,23,59,59),l:'🇺🇸 VETERANS DAY • NOVEMBER 11'},{d:new Date(2026,11,7,23,59,59),l:'⚓ PEARL HARBOR DAY • DECEMBER 7'},{d:new Date(2026,11,25,23,59,59),l:'🎄 CHRISTMAS • DECEMBER 25'}].filter(x=>x.d>=n).sort((a,b)=>a.d-b.d);if(dates[0])t.innerHTML='<span class="tickerItem"><strong>NEXT HOLIDAY:</strong> '+dates[0].l+'</span>';})();</script>'''
          if 'holiday-final-override' not in s:
              s=s.replace('</body>',override+'\n</body>')
          p.write_text(s)
          PY
          grep -q 'id="visitCount">4,062' index.html
          grep -q 'width:min(300px,84vw)' index.html
          grep -q 'ronnie-listening-veteran.jpg' index.html
          grep -q 'ronnie-community-support.jpg' index.html
          grep -q 'ronnie-shure-founder-20260902-older-gray.png' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}