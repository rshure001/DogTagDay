name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate rebuilt homepage
        run: |
          set -e
          test -s index.html
          test -s assets/camera-crew-final.jpg
          test -s assets/dogtagday-no-hats-final.jpg
          grep -q '4,304' index.html
          grep -q 'camera-crew-final.jpg' index.html
          grep -q 'ronnie-shure-founder-20260902-older-gray.png' index.html
          grep -q 'honor-jar-click-pledge.png' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
