name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore approved Ronnie photos and prepare homepage
        run: |
          set -e
          test -s index.html
          mkdir -p assets
          cat .imageparts/rv1.01 .imageparts/rv1.02 .imageparts/rv1.03 | base64 -d > assets/ronnie-listening-veteran.jpg
          cat .imageparts/rv3m.01 .imageparts/rv3m.02 | base64 -d > assets/ronnie-community-support.jpg
          test -s assets/ronnie-listening-veteran.jpg
          test -s assets/ronnie-community-support.jpg
          file assets/ronnie-listening-veteran.jpg | grep -qi 'JPEG image data'
          file assets/ronnie-community-support.jpg | grep -qi 'JPEG image data'
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_people='<div class="slider" id="peopleSlider"><figure class="slide"><img src="assets/dog-tag-day-realistic-veterans-20260901.jpg?v=20260916-final" alt="Veterans together"><figcaption>THE PEOPLE BEHIND THE TAGS</figcaption></figure><figure class="slide"><img src="assets/ronnie-founder-natural-facial-hair-20260903.jpg?v=20260916-final" alt="Ronnie Shure, Founder and CEO"><figcaption>RONNIE SHURE • FOUNDER &amp; CEO</figcaption></figure><figure class="slide"><img src="assets/ronnie-shure-founder-20260901.jpg?v=20260916-final" alt="Ronnie Shure"><figcaption>REAL PEOPLE • REAL STORIES • A STRONGER TOMORROW</figcaption></figure></div>'
          new_people='<div class="slider" id="peopleSlider"><figure class="slide"><img src="assets/ronnie-listening-veteran.jpg?v=20260916-restored" alt="Ronnie Shure sitting face to face with a veteran and listening"><figcaption>SIT DOWN • HEAR THE STORY • STAY WITH THEM</figcaption></figure><figure class="slide"><img src="assets/ronnie-community-support.jpg?v=20260916-restored" alt="Ronnie Shure supporting veterans and community members"><figcaption>REAL SUPPORT • REAL PEOPLE • REAL COMMUNITY</figcaption></figure><figure class="slide"><img src="assets/dog-tag-day-realistic-veterans-20260901.jpg?v=20260916-final" alt="Veterans together"><figcaption>THE PEOPLE BEHIND THE TAGS</figcaption></figure></div>'
          old_work='<div class="slider" id="workSlider"><figure class="slide"><img src="assets/dog-tag-day-realistic-veterans-20260901.jpg?v=20260916-work-final" alt="Veterans and community together"><figcaption>LISTEN • CONNECT • STAY WITH THE STORY</figcaption></figure><figure class="slide"><img src="assets/ronnie-founder-natural-facial-hair-20260903.jpg?v=20260916-work-final" alt="Ronnie Shure"><figcaption>SHOW UP • LISTEN • STAY</figcaption></figure><figure class="slide"><img src="assets/ronnie-shure-founder-20260901.jpg?v=20260916-work-final" alt="Ronnie Shure"><figcaption>REAL SUPPORT • REAL PEOPLE • REAL STORIES</figcaption></figure></div>'
          new_work='<div class="slider" id="workSlider"><figure class="slide"><img src="assets/ronnie-community-support.jpg?v=20260916-restored" alt="Dog Tag Day real support scenes with Ronnie Shure beside veterans and community members"><figcaption>WE SHOW UP • WE LISTEN • WE STAY</figcaption></figure><figure class="slide"><img src="assets/ronnie-listening-veteran.jpg?v=20260916-restored" alt="Ronnie Shure sitting and talking with a veteran"><figcaption>PERSON TO PERSON • HEAR THE STORY</figcaption></figure><figure class="slide"><img src="assets/dog-tag-day-realistic-veterans-20260901.jpg?v=20260916-final" alt="Veterans together"><figcaption>IDENTITY • BROTHERHOOD • HONOR</figcaption></figure></div>'
          if old_people not in s: raise SystemExit('people slider source changed; refusing blind patch')
          if old_work not in s: raise SystemExit('work slider source changed; refusing blind patch')
          s=s.replace(old_people,new_people).replace(old_work,new_work)
          override='''<script id="holiday-final-override">(function(){const t=document.getElementById('holidayTicker');if(!t)return;const n=new Date();const nth=(Y,M,W,N)=>{const d=new Date(Y,M,1),a=(7+W-d.getDay())%7;return new Date(Y,M,1+a+7*(N-1),23,59,59)};const dates=[{d:new Date(2026,9,31,23,59,59),l:'🎃 HALLOWEEN • OCTOBER 31'},{d:new Date(2026,10,11,23,59,59),l:'🇺🇸 VETERANS DAY • NOVEMBER 11'},{d:nth(2026,10,4,4),l:'🦃 THANKSGIVING'},{d:new Date(2026,11,7,23,59,59),l:'⚓ PEARL HARBOR DAY • DECEMBER 7'},{d:new Date(2026,11,25,23,59,59),l:'🎄 CHRISTMAS • DECEMBER 25'}].filter(x=>x.d>=n).sort((a,b)=>a.d-b.d);if(dates[0])t.innerHTML='<span class="tickerItem"><strong>NEXT HOLIDAY:</strong> '+dates[0].l+'</span>';})();</script>'''
          s=s.replace('</body>',override+'\n</body>')
          p.write_text(s)
          PY
          grep -q 'ronnie-listening-veteran.jpg' index.html
          grep -q 'ronnie-community-support.jpg' index.html
          grep -q 'peopleSlider' index.html
          grep -q 'workSlider' index.html
          grep -q 'letter-to-president.html' index.html
          grep -q 'id="visitCount">4,300' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}