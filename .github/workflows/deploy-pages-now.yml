name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify final military photos homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-15-final-military-photos' index.html
          grep -q 'Identity • Brotherhood • Honor' index.html
          grep -q 'SWIPE SIDE TO SIDE' index.html
          grep -q 'combat-team-final.jpg' index.html
          grep -q 'barbecue-team-final.jpg' index.html
          grep -q 'camera-crew-final.jpg' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production homepage
        run: |
          set -e
          for i in $(seq 1 36); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'final-military-photos' && printf '%s' "$html" | grep -q 'combat-team-final.jpg' && printf '%s' "$html" | grep -q 'camera-crew-final.jpg'; then
              echo LIVE_FINAL_MILITARY_PHOTOS_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
