name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate current homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-approved-visual-v8-new-six-images' index.html
          grep -q 'Veterans should not become invisible' index.html
          grep -q 'What We Do All Year' index.html
          grep -q 'Donate Through the Honor Jar' index.html
          grep -q 'Open Letter to President Donald J. Trump' index.html
          grep -q '2d86c0c7-449c-4e1c-b1b7-4b6a20ab2974.png' index.html
          grep -q '2e6c7dc1-ecf5-4018-b68c-1656da4779d7.png' index.html
          grep -q 'de5ee881-4b6b-4503-9c4e-5b06069b252d.png' index.html
          grep -q 'a2477f7e-1543-4ff8-a1bc-e48ec43b8df0.png' index.html
          grep -q '0527c2cd-b83e-4666-a379-241ae57cee0e.png' index.html
          grep -q 'f7d4f439-9f21-4fc9-ba2a-e4fa1ebfea06.png' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
