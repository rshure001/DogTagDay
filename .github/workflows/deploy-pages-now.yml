name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-restored-homepage
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Harden mobile layout and force fresh assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('</head>', '<style id="mobile-hard-fix">@media(max-width:700px){header{position:relative!important;top:auto!important}header nav{display:none!important}.hero-shell{padding-top:12px!important}#outreach{position:relative!important;z-index:1!important}.map-intro{padding-top:18px!important}}</style></head>')
          sha=os.environ.get('GITHUB_SHA','fresh')[:12]
          s=re.sub(r'music-player\.js\?v=[^"\']+', f'music-player.js?v=MOBILEHARD-{sha}', s)
          s=re.sub(r'styles\.css\?v=[^"\']+', f'styles.css?v=MOBILEHARD-{sha}', s)
          p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live mobile hard fix
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            js=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/music-player.js?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'mobile-hard-fix' \
              && printf '%s' "$html" | grep -q 'header nav{display:none!important}' \
              && printf '%s' "$html" | grep -q 'music-player.js?v=MOBILEHARD-' \
              && printf '%s' "$js" | grep -q 'DTD_HOLIDAY_STATIC_V4' \
              && printf '%s' "$js" | grep -q 'header nav{display:none!important}'; then
              echo 'LIVE_MOBILE_HARD_FIX_VERIFIED'
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
