name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact live homepage build
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://dogtagday.org/?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-30-restored-full-map"' \
              && printf '%s' "$html" | grep -q '1,800 Outreach Lights' \
              && printf '%s' "$html" | grep -q 'map-christmas-1800-v4.html' \
              && printf '%s' "$html" | grep -q 'Why It Matters' \
              && printf '%s' "$html" | grep -q 'Share Your Story'; then
              echo 'LIVE_RESTORED_FULL_MAP_VERIFIED'
              ok=1
              break
            fi
            echo "Waiting for restored full homepage... attempt $i"
            sleep 10
          done
          test "$ok" -eq 1
