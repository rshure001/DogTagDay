name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify homepage exists
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-pictures-restored' index.html
          grep -q 'dog-tag-day-hero.PNG' index.html
          grep -q 'dog-tag-day-realistic-veterans-20260901.jpg' index.html
          grep -q 'ronnie-founder-natural-facial-hair-20260903.jpg' index.html
          grep -q 'ronnie-shure-founder-20260901.jpg' index.html
          grep -q 'peopleSlider' index.html
          grep -q 'workSlider' index.html
          grep -q 'letter-to-president.html' index.html
          grep -q 'id="visitCount">4,300' index.html
          grep -q 'VISITS TO DOGTAGDAY.ORG' index.html
          grep -q 'id="holidayTicker"' index.html
          grep -q 'NEXT HOLIDAY:' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
