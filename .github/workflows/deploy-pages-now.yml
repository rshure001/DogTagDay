name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build approved live homepage
        run: |
          set -e
          test -s index.html
          mkdir -p assets
          cat .imageparts/rv1.01 .imageparts/rv1.02 .imageparts/rv1.03 | base64 -d > assets/ronnie-listening-veteran.jpg
          cat .imageparts/rv3m.01 .imageparts/rv3m.02 | base64 -d > assets/ronnie-community-support.jpg
          file assets/ronnie-listening-veteran.jpg | grep -qi 'JPEG image data'
          file assets/ronnie-community-support.jpg | grep -qi 'JPEG image data'
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Keep action photos on both sliders and remove founder portrait substitutions.
          s=s.replace('assets/ronnie-founder-natural-facial-hair-20260903.jpg?v=20260916-work-final','assets/ronnie-listening-veteran.jpg?v=20260916-action')
          s=s.replace('assets/ronnie-shure-founder-20260901.jpg?v=20260916-work-final','assets/ronnie-community-support.jpg?v=20260916-action')
          # Restore Honor Jar as a permanent bottom-page section above visitors.
          jar_css='''<style id="honor-jar-style">.honorJarSection{max-width:1080px;margin:0 auto;padding:46px 18px}.honorJarCard{position:relative;overflow:hidden;text-align:center;background:linear-gradient(145deg,#102947,#071426);border:3px solid #d9b75d;border-radius:12px;padding:30px 22px;box-shadow:inset 0 0 0 2px #fff}.honorJarCard img{width:min(180px,48vw);height:auto;display:block;margin:0 auto 12px}.honorJarCard h2{font:900 clamp(2rem,7vw,3.4rem)/1.02 Georgia,serif;margin:8px 0 12px}.honorJarCard p{max-width:720px;margin:0 auto 18px;color:#dce5ef;line-height:1.6}.honorAmounts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.honorAmounts a{display:inline-block;text-decoration:none;background:#d9b75d;color:#071426;border:2px solid #fff;border-radius:999px;padding:11px 17px;font-weight:900}.honorMain{display:inline-block;margin-top:12px;text-decoration:none;background:#123f75;color:#fff;border:2px solid #d9b75d;border-radius:999px;padding:13px 20px;font-weight:900}.honorFine{display:block;margin-top:12px;color:#aebdca;font-size:.78rem}</style>'''
          if 'id="honor-jar-style"' not in s:
              s=s.replace('</head>',jar_css+'\n</head>')
          jar='''<section class="honorJarSection" id="honor-jar" aria-labelledby="honor-jar-title"><div class="honorJarCard"><img src="assets/honor-jar-click-pledge.png?v=20260916" alt="Honor Jar"><div class="eyebrow">The Honor Jar</div><h2 id="honor-jar-title">Help a Veteran Be Seen</h2><p>Your gift helps preserve veterans’ stories, build April 18 community participation, and connect veterans who ask for help with trusted resources.</p><div class="honorAmounts"><a href="donate.html?amount=1">$1</a><a href="donate.html?amount=5">$5</a><a href="donate.html?amount=20">$20</a><a href="donate.html?amount=100">$100</a></div><a class="honorMain" href="donate.html">DONATE THROUGH THE HONOR JAR</a><small class="honorFine">Secure donation through PayPal • Dog Tag Day Foundation</small></div></section>'''
          if 'id="honor-jar"' not in s:
              marker='<section id="visitors"'
              if marker in s:
                  s=s.replace(marker,jar+'\n'+marker,1)
              else:
                  s=s.replace('</main>',jar+'\n</main>')
          # Force current next-holiday strip to Halloween, then advance after Oct 31.
          override='''<script id="holiday-final-override">(function(){const t=document.getElementById('holidayTicker');if(!t)return;const n=new Date();const dates=[{d:new Date(2026,9,31,23,59,59),l:'🎃 HALLOWEEN • OCTOBER 31'},{d:new Date(2026,10,11,23,59,59),l:'🇺🇸 VETERANS DAY • NOVEMBER 11'},{d:new Date(2026,11,7,23,59,59),l:'⚓ PEARL HARBOR DAY • DECEMBER 7'},{d:new Date(2026,11,25,23,59,59),l:'🎄 CHRISTMAS • DECEMBER 25'}].filter(x=>x.d>=n).sort((a,b)=>a.d-b.d);if(dates[0])t.innerHTML='<span class="tickerItem"><strong>NEXT HOLIDAY:</strong> '+dates[0].l+'</span>';})();</script>'''
          if 'holiday-final-override' not in s:
              s=s.replace('</body>',override+'\n</body>')
          p.write_text(s)
          PY
          grep -q 'ronnie-listening-veteran.jpg' index.html
          grep -q 'ronnie-community-support.jpg' index.html
          grep -q 'id="honor-jar"' index.html
          grep -q 'DONATE THROUGH THE HONOR JAR' index.html
          grep -q 'donate.html?amount=20' index.html
          grep -q 'letter-to-president.html' index.html
          grep -q 'HALLOWEEN' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}