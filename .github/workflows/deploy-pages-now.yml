name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate current homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-approved-visual-v7' index.html
          grep -q 'Veterans should not become invisible' index.html
          grep -q 'What We Do All Year' index.html
          grep -q 'Donate Through the Honor Jar' index.html
          grep -q 'Open Letter to President Donald J. Trump' index.html
          grep -q '25271eea-4822-4fb3-973b-f944f7da9961.png' index.html
          grep -q '62c16051-50ed-4eb1-955e-0c133709d962.png' index.html
          grep -q '218d9855-89bc-4e8a-8f81-a89fec267374.png' index.html
          grep -q '33af325c-d736-4804-add0-815b72f85661.png' index.html
          grep -q '43d71ff5-f9ca-4d41-b0ba-544612cb750d.png' index.html
          grep -q 'd9eead0f-908e-465d-954b-a532c18385de.png' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
