name: Deploy Dog Tag Day Now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify current homepage
        run: |
          set -e
          test -s index.html
          grep -q '2026-09-16-photo-assets-restored' index.html
          grep -q '4,300+' index.html
          grep -q 'holidayStrip' index.html
          grep -q 'approved-dog-tags.PNG' index.html
          grep -q 'dog-tag-day-realistic-veterans-20260901.jpg' index.html
          grep -q 'ronnie-founder-natural-facial-hair-20260903.jpg' index.html
          test -s assets/approved-dog-tags.PNG
          test -s assets/dog-tag-day-realistic-veterans-20260901.jpg
          test -s assets/dog-tag-day-civilian-veterans-silencers-20260912.png
          test -s assets/ronnie-founder-natural-facial-hair-20260903.jpg
          test -s assets/dog-tag-day-national-map-brighter-20260913.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production homepage
        run: |
          set -e
          for i in $(seq 1 36); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q '2026-09-16-photo-assets-restored' && printf '%s' "$html" | grep -q '4,300+' && printf '%s' "$html" | grep -q 'holidayStrip' && printf '%s' "$html" | grep -q 'approved-dog-tags.PNG'; then
              echo LIVE_CURRENT_HOMEPAGE_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
