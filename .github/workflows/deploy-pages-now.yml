name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-restored-homepage
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/dog-tag-day-five-no-hats.webp
          test -s map-golden-1850.html
          grep -q 'data-dtd-build="2026-08-31-five-veterans-no-hats"' index.html
          grep -q 'href="#outreach">Across America</a>' index.html
          grep -q 'Nationwide Outreach' index.html
          grep -q 'dog-tag-day-five-no-hats.webp' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live homepage
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-31-five-veterans-no-hats"' \
              && printf '%s' "$html" | grep -q 'href="#outreach">Across America</a>' \
              && printf '%s' "$html" | grep -q 'Nationwide Outreach' \
              && printf '%s' "$html" | grep -q 'dog-tag-day-five-no-hats.webp'; then
              echo "LIVE_HOMEPAGE_VERIFIED"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
