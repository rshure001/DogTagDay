name: Deploy Dog Tag Day Now
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s map-golden-1850.html
          grep -q 'data-dtd-build="2026-08-31-live-partners-v2"' index.html
          grep -q 'data:image/webp;base64,' index.html
          grep -q 'Nationwide Outreach' index.html
          grep -q 'Partner With Dog Tag Day' index.html
          grep -q 'PARTNER WITH DOG TAG DAY' map-golden-1850.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            html=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/?partners=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            maphtml=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://dogtagday.org/map-golden-1850.html?partners=${GITHUB_SHA}-${GITHUB_RUN_ID}-$i" || true)
            if printf '%s' "$html" | grep -q 'data-dtd-build="2026-08-31-live-partners-v2"' \
              && printf '%s' "$html" | grep -q 'Partner With Dog Tag Day' \
              && printf '%s' "$html" | grep -q 'Nationwide Outreach' \
              && printf '%s' "$maphtml" | grep -q 'PARTNER WITH DOG TAG DAY' \
              && printf '%s' "$maphtml" | grep -q 'Sponsors'; then
              echo LIVE_PARTNERS_HOMEPAGE_VERIFIED
              exit 0
            fi
            sleep 5
          done
          exit 1
