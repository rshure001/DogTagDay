name: Verify Live Homepage
on:
  workflow_run:
    workflows: ["Deploy Dog Tag Day Now"]
    types: [completed]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let ok=false;
            try {
              for(let i=0;i<20;i++){
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
                const hero=page.locator('.hero img');
                const map=page.locator('.staticMapImage img');
                await hero.waitFor({state:'visible',timeout:10000});
                await map.waitFor({state:'visible',timeout:10000});
                const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
                const heroCount=await hero.count();
                const mapCount=await map.count();
                const body=(await page.locator('body').innerText()).toLowerCase();
                const text=body.includes('17.2 million')&&body.includes('honor a veteran today')&&body.includes('what the dots mean');
                const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
                const navFits=await page.locator('nav a').last().evaluate(el=>el.getBoundingClientRect().right<=window.innerWidth+1);
                console.log(JSON.stringify({attempt:i+1,broken,mapCount,heroCount,text,noOverflow,navFits}));
                if(broken.length===0&&heroCount===1&&mapCount===1&&text&&noOverflow&&navFits){ok=true;break;}
                await page.waitForTimeout(3000);
              }
            } catch (error) {
              console.error(error);
            } finally {
              await page.screenshot({path:'live-homepage-proof.png'}).catch(console.error);
              await browser.close();
            }
            if(!ok) process.exit(1);
            console.log('LIVE_HOMEPAGE_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png
