name: Verify Live Homepage
on:
  workflow_run:
    workflows: ["Deploy Dog Tag Day Now"]
    types: [completed]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage and Stories image
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.route('**/dogtagday-counter', route => route.abort());
            let ok=true;
            try {
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const build=await page.locator('html').getAttribute('data-dtd-build');
              const brokenHome=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
              const noOverflowHome=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
              const body=await page.locator('body').innerText();
              const homeOk=/^2026-\d{2}-\d{2}-final-v\d+$/.test(build||'')&&brokenHome.length===0&&noOverflowHome&&body.includes('too many veterans become invisible once the uniform comes off.')&&body.includes('HONOR JAR');
              console.log(JSON.stringify({page:'home',build,brokenHome,noOverflowHome,homeOk}));
              await page.screenshot({path:'live-homepage-proof-current.png',fullPage:true});
              if(!homeOk) ok=false;

              await page.goto('https://dogtagday.org/stories.html?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const shareCount=await page.locator('.share-photo').count();
              const brokenStories=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
              const noOverflowStories=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
              const storyBody=await page.locator('body').innerText();
              const storyOk=shareCount===0&&brokenStories.length===0&&noOverflowStories&&storyBody.includes('SHARE THE STORY BEHIND THE TAGS')&&storyBody.includes('Tell your story.');
              console.log(JSON.stringify({page:'stories',shareCount,brokenStories,noOverflowStories,storyOk}));
              await page.screenshot({path:'live-stories-proof-current.png',fullPage:true});
              if(!storyOk) ok=false;
            } catch(e){ console.error(e); ok=false; } finally { await browser.close(); }
            if(!ok) process.exit(1);
            console.log('LIVE_CURRENT_IPHONE_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-current-iphone-proof
          path: |
            live-homepage-proof-current.png
            live-stories-proof-current.png
