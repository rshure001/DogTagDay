name: Verify Live Homepage
on:
  workflow_run:
    workflows: ["Deploy Dog Tag Day Now"]
    types: [completed]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage v13
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let ok=false;
            try {
              for(let i=0;i<20;i++){
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                const hero=page.locator('.hero img');
                const storyImgs=page.locator('#story .storygrid img');
                const founderImgs=page.locator('#founder .foundergrid img');
                const map=page.locator('img[alt="Dog Tag Day outreach across America"]');
                await hero.waitFor({state:'visible',timeout:10000});
                await map.waitFor({state:'visible',timeout:10000});
                const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
                const body=(await page.locator('body').innerText());
                const lower=body.toLowerCase();
                const build=await page.locator('html').getAttribute('data-dtd-build');
                const srcs=await page.locator('img').evaluateAll(imgs=>imgs.map(i=>i.getAttribute('src')||''));
                const noPicsart=!srcs.some(s=>s.includes('gcdn.picsart.com'));
                const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
                const topPosition=await page.locator('.top').evaluate(el=>getComputedStyle(el).position);
                const nextHoliday=(body.match(/NEXT HOLIDAY:/g)||[]).length===1 && body.includes('HALLOWEEN') && !body.includes('VETERANS DAY') && !body.includes('THANKSGIVING') && !body.includes('CHRISTMAS') && !body.includes("NEW YEAR'S DAY");
                const text=lower.includes('veterans should not become invisible')&&lower.includes('no man left behind')&&lower.includes('the uniform comes off')&&lower.includes('different paths')&&lower.includes('see the veteran')&&lower.includes('4,817')&&lower.includes('ronnie shure');
                const result={attempt:i+1,build,broken,heroCount:await hero.count(),storyImageCount:await storyImgs.count(),founderImageCount:await founderImgs.count(),mapCount:await map.count(),noPicsart,noOverflow,topPosition,nextHoliday,text,srcs};
                console.log(JSON.stringify(result));
                if(build==='2026-09-16-live-fix-v13'&&broken.length===0&&result.heroCount===1&&result.storyImageCount===3&&result.founderImageCount===3&&result.mapCount===1&&noPicsart&&noOverflow&&topPosition==='relative'&&nextHoliday&&text){ok=true;break;}
                await page.waitForTimeout(3000);
              }
            } catch (error) { console.error(error); }
            finally {
              await page.screenshot({path:'live-homepage-proof-v13.png',fullPage:true}).catch(console.error);
              await browser.close();
            }
            if(!ok) process.exit(1);
            console.log('LIVE_HOMEPAGE_V13_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof-v13
          path: live-homepage-proof-v13.png
