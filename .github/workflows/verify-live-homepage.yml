name: Verify Live Homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage timeline and map
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let ok=false;
            for(let i=0;i<12;i++){
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const body=await page.locator('body').innerText();
              const timeline=await page.locator('.action-line').count();
              const steps=await page.locator('.action-step').count();
              const map=await page.locator('.map-card svg').count();
              const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).length);
              const text=body.includes('Wear Your Tags')&&body.includes('Acknowledge One')&&body.includes('Tell the Story')&&body.includes('Help It Reach America');
              console.log(`attempt=${i+1} timeline=${timeline} steps=${steps} map=${map} brokenImages=${broken} text=${text}`);
              if(timeline===1&&steps===4&&map===1&&broken===0&&text){ok=true;break;}
              await page.waitForTimeout(10000);
            }
            await page.screenshot({path:'live-homepage-proof.png',fullPage:true});
            await browser.close();
            if(!ok) process.exit(1);
            console.log('LIVE_VERTICAL_MAP_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png
