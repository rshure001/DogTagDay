name: Verify Live Homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let ok=false;
            for(let i=0;i<36;i++){
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const build=await page.locator('html').getAttribute('data-dtd-build');
              const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
              const mapCount=await page.locator('#outreach iframe').count();
              const heroCount=await page.locator('.heroBanner img').count();
              const heroSrc=heroCount===1?await page.locator('.heroBanner img').getAttribute('src'):'';
              const body=await page.locator('body').innerText();
              const text=body.includes('Don’t let our veterans fade into the background.')&&body.includes('Nationwide Outreach')&&body.includes('Partner With Dog Tag Day');
              const current=build==='2026-08-31-approved-hero'&&heroCount===1&&heroSrc.includes('approved-dog-tags.PNG');
              console.log(JSON.stringify({attempt:i+1,build,broken,mapCount,heroCount,heroSrc,current,text}));
              if(current&&broken.length===0&&mapCount===1&&text){ok=true;break;}
              await page.waitForTimeout(5000);
            }
            await page.screenshot({path:'live-homepage-proof.png',fullPage:true});
            await browser.close();
            if(!ok) process.exit(1);
            console.log('LIVE_HOMEPAGE_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png
