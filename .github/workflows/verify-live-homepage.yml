name: Verify Live Homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone president preview
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let ok=false;
            for(let i=0;i<24;i++){
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const build=await page.locator('html').getAttribute('data-dtd-build');
              const body=await page.locator('body').innerText();
              const map=page.locator('#outreach iframe');
              const mapCount=await map.count();
              const support=page.locator('#support .support-banner');
              const items=page.locator('#support .support-item');
              const labels=await items.locator('h3').allTextContents();
              let cols='', mapTop=0, supportTop=0, widths=[];
              if(await support.count()) cols=await support.evaluate(el=>getComputedStyle(el).gridTemplateColumns);
              if(mapCount){const b=await map.boundingBox(); if(b) mapTop=b.y;}
              if(await support.count()){const b=await support.boundingBox(); if(b) supportTop=b.y;}
              widths=await items.evaluateAll(els=>els.map(e=>Math.round(e.getBoundingClientRect().width)));
              const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).length);
              const text=body.includes('1,850+ Outreach Lights')&&labels.join('|')==='Sponsors|Donations|Partnerships';
              const horizontal=widths.length===3&&Math.max(...widths)-Math.min(...widths)<8&&widths.every(w=>w>70);
              const order=mapTop>0&&supportTop>mapTop;
              console.log(`attempt=${i+1} build=${build} map=${mapCount} labels=${labels.join('|')} cols=${cols} widths=${widths.join(',')} mapTop=${mapTop} supportTop=${supportTop} broken=${broken} text=${text} horizontal=${horizontal} order=${order}`);
              if(build==='2026-08-30-president-preview'&&mapCount===1&&text&&horizontal&&order&&broken===0){ok=true;break;}
              await page.waitForTimeout(10000);
            }
            await page.screenshot({path:'live-homepage-proof.png',fullPage:true});
            await browser.close();
            if(!ok) process.exit(1);
            console.log('LIVE_GOLDEN_1850_HORIZONTAL_SUPPORT_IPHONE_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png
