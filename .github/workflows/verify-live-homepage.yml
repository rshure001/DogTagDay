name: Verify Live Homepage
on:
  workflow_run:
    workflows: ["Deploy Dog Tag Day Now"]
    types: [completed]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live iPhone homepage and letter v74
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.route('**/dogtagday-counter', route => route.abort());
            let ok=false;
            try {
              for(let i=0;i<3;i++){
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                const build=await page.locator('html').getAttribute('data-dtd-build');
                const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
                const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
                const body=await page.locator('body').innerText();
                const founderImgs=await page.locator('#founder .foundergrid img').evaluateAll(imgs=>imgs.map(i=>i.getAttribute('src')||''));
                const storySrc=await page.locator('#story .feature img').getAttribute('src');
                const okText=body.includes('Veterans should not become invisible.')&&body.includes('HONOR JAR')&&body.includes('RONNIE SHURE');
                const photosOk=founderImgs.some(s=>s.includes('101421fe-e1ec-4334-9baa-33a834c8c1a3.png'))&&founderImgs.some(s=>s.includes('d203ec6d-8bbd-4dbe-8c48-fd423fedfe42.png'))&&(storySrc||'').includes('f58b165e-9962-4792-9173-4da0bf08291b.png')&&!founderImgs.some(s=>s.includes('41e23de4-8354-419a-b5ab-eab06c5f5c28.png'));
                console.log(JSON.stringify({attempt:i+1,build,broken,noOverflow,okText,photosOk,founderImgs,storySrc}));
                if(build==='2026-09-17-final-v74'&&broken.length===0&&noOverflow&&okText&&photosOk){ok=true;break;}
                await page.waitForTimeout(2000);
              }
              await page.screenshot({path:'live-homepage-proof-v74.png',fullPage:true});
              await page.goto('https://dogtagday.org/letter-to-president.html?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const stars=(await page.locator('.stars').innerText()).replace(/\s+/g,' ').trim();
              const paper=await page.locator('.paper').count();
              const letterOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
              if(!stars.includes('★')||paper!==1||!letterOverflow) ok=false;
              await page.screenshot({path:'live-letter-proof-v74.png',fullPage:true});
            } catch(e){console.error(e); ok=false;} finally { await browser.close(); }
            if(!ok) process.exit(1);
            console.log('LIVE_V74_IPHONE_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-v74-iphone-proof
          path: |
            live-homepage-proof-v74.png
            live-letter-proof-v74.png
