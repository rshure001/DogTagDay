name: Remove Live Map
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-live-map.yml'
permissions:
  contents: write
jobs:
  remove-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Remove map from live homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#reach-across-america">Map</a>','')
          start=s.find('<section id="reach-across-america"')
          if start!=-1:
              end=s.find('<section class="identity-ribbon">', start)
              if end==-1:
                  raise SystemExit('Identity ribbon not found after map section')
              s=s[:start]+s[end:]
          p.write_text(s)
          PY
      - name: Push no-map homepage to gh-pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove outreach map from live homepage"
          git push origin HEAD:gh-pages