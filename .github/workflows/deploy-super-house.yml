name: Deploy Dog Tag Day Super House
on:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - 'super-house/**'
      - 'super-house-worker.js'
      - '.github/workflows/deploy-super-house.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Super House
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --temporary

      - name: Trigger approved commercial relay
        shell: bash
        env:
          RELAY_URL: https://dog-tag-day-super-house.juvenile-lemming.workers.dev/api/relay
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)" "$RESPONSE")"
          RELAY="$(curl -fsS --retry 3 --retry-delay 2 -X POST             -H "Authorization: Bearer $TOKEN"             -H "content-type: application/json"             --data '{"commercials":["commercial-1","commercial-2","commercial-3"]}'             "$RELAY_URL")"
          echo "$RELAY"
          echo "$RELAY" | grep -q '"ok": true'
          echo "RELAY_ACCEPTED=true"
