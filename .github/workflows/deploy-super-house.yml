name: Deploy Dog Tag Day Super House

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Confirm deployment to the production Cloudflare Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.deploy_production == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Super House to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
