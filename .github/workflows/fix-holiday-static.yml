name: Fix Holiday Mascot Static
on:
  push:
    paths:
      - '.github/workflows/fix-holiday-static.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch holiday mascot behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('music-player.js')
          s=p.read_text()
          s=s.replace("#dtd-seasonal-accent{position:absolute;top:8px;right:8px;", "#dtd-seasonal-accent{position:absolute;top:92px;right:8px;")
          s=s.replace("transition:opacity .35s ease,transform .35s ease", "transition:none")
          s=s.replace("@media(max-width:600px){#dtd-seasonal-accent{width:72px;top:6px;right:6px}", "@media(max-width:600px){#dtd-seasonal-accent{width:72px;top:82px;right:6px}")
          start=s.index(" const order=['Labor Day'")
          end=s.index("\n}\nconst duplicate=", start)
          new=r''' const order=['New Year','Valentine’s Day','St. Patrick’s Day','Easter','National Pet Day','Memorial Day','Juneteenth','Independence Day','Labor Day','Patriot Day','Constitution Day','Halloween','Veterans Day','Thanksgiving','Christmas'];
 const a=document.createElement('div');a.id='dtd-seasonal-accent';a.innerHTML='<div class="holiday-art"></div><div class="holiday-name"></div>';hero.appendChild(a);
 const show=name=>{a.setAttribute('aria-label',name+' holiday accent');a.querySelector('.holiday-art').outerHTML=art[name];a.querySelector('.holiday-name').textContent=name};
 const atNoon=(y,m,d)=>new Date(y,m,d,12,0,0,0);
 const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return atNoon(y,month-1,day)};
 const firstMonday=(y,m)=>{const d=atNoon(y,m,1);d.setDate(1+(8-d.getDay())%7);return d};
 const lastMonday=(y,m)=>{const d=atNoon(y,m+1,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
 const fourthThursday=(y,m)=>{const d=atNoon(y,m,1);d.setDate(1+(11-d.getDay())%7+21);return d};
 const holidays=y=>[
  ['New Year',atNoon(y,0,1)],['Valentine’s Day',atNoon(y,1,14)],['St. Patrick’s Day',atNoon(y,2,17)],['Easter',easter(y)],['National Pet Day',atNoon(y,3,11)],['Memorial Day',lastMonday(y,4)],['Juneteenth',atNoon(y,5,19)],['Independence Day',atNoon(y,6,4)],['Labor Day',firstMonday(y,8)],['Patriot Day',atNoon(y,8,11)],['Constitution Day',atNoon(y,8,17)],['Halloween',atNoon(y,9,31)],['Veterans Day',atNoon(y,10,11)],['Thanksgiving',fourthThursday(y,10)],['Christmas',atNoon(y,11,25)]
 ].sort((x,y)=>x[1]-y[1]);
 const now=new Date(),today=atNoon(now.getFullYear(),now.getMonth(),now.getDate());
 let next=holidays(now.getFullYear()).find(([,d])=>d>=today);
 if(!next) next=holidays(now.getFullYear()+1)[0];
 a.classList.add('hide-label');
 show(next[0]);'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit main fix
        run: |
          git config user.name "rshure001"
          git config user.email "rshure001@yahoo.com"
          git add music-player.js
          git commit -m "Keep holiday mascot static and move it lower"
          git push origin main
      - name: Mirror to gh-pages
        run: |
          cp music-player.js /tmp/music-player.js
          git checkout gh-pages
          cp /tmp/music-player.js music-player.js
          git add music-player.js
          git commit -m "Keep holiday mascot static and move it lower" || true
          git push origin gh-pages
      - name: Verify source behavior
        run: |
          grep -q "top:92px" music-player.js
          grep -q "top:82px" music-player.js
          grep -q "transition:none" music-player.js
          ! grep -q "setInterval" music-player.js
          grep -q "holidays(now.getFullYear())" music-player.js
