name: Refresh Pages Domain
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Re-assert custom domain and HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"dogtagday.org","https_enforced":true,"build_type":"workflow"}'
          echo "PAGES_DOMAIN_REFRESHED"
