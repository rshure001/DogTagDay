name: Refresh Pages Domain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-pages-domain.yml'
permissions:
  contents: read
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Re-assert custom domain and HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"dogtagday.org","https_enforced":true}'
