name: Dog Tag Day — Start Commercial Publisher

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  dispatch-commercial:
    runs-on: ubuntu-latest
    steps:
      - name: Start existing owned direct publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching broadcast-now.yml..."
          gh workflow run broadcast-now.yml --repo rshure001/DogTagDay --ref main
          echo "Owned direct publisher workflow dispatched."
