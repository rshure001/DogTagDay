name: Verify Ask Page WebKit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ask-webkit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright WebKit
        run: |
          mkdir -p /tmp/dtd-webkit
          cd /tmp/dtd-webkit
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null 2>&1
      - name: Verify live Ask page
        run: |
          cd /tmp/dtd-webkit
          cat > test.js <<'EOF'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.goto('https://dogtagday.org/ask.html?verify='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.locator('#q').fill('When did Dog Tag Day start?');
            await page.getByRole('button',{name:'Ask'}).click();
            const text=await page.locator('#a').innerText();
            if(!text.includes('Dog Tag Day Foundation was created')) throw new Error('Expected answer missing: '+text);
            if(!text.includes('When did Dog Tag Day start?')) throw new Error('Question echo missing: '+text);
            console.log('WEBKIT_MOBILE_ASK_PASS=true');
            console.log(text);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test.js
