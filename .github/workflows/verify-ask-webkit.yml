name: Verify Ask Page WebKit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ask-webkit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright WebKit
        run: |
          mkdir -p /tmp/dtd-webkit
          cd /tmp/dtd-webkit
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null 2>&1
      - name: Verify live Ask page founder and history
        run: |
          cd /tmp/dtd-webkit
          cat > test.js <<'EOF'
          const { webkit, devices } = require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            let founderText='';
            for(let attempt=1;attempt<=12;attempt++){
              await page.goto('https://dogtagday.org/ask.html?verify='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              await page.locator('#q').fill('Tell me about the founder');
              await page.getByRole('button',{name:'Ask'}).click();
              founderText=await page.locator('#a').innerText();
              if(founderText.includes('Ronnie Shure is the Founder & President')) break;
              if(attempt<12) await sleep(10000);
            }
            if(!founderText.includes('Ronnie Shure is the Founder & President')) throw new Error('Founder answer still wrong: '+founderText);
            if(!founderText.includes('Tell me about the founder')) throw new Error('Founder question echo missing: '+founderText);
            await page.locator('#q').fill('When did Dog Tag Day start?');
            await page.getByRole('button',{name:'Ask'}).click();
            const historyText=await page.locator('#a').innerText();
            if(!historyText.includes('Dog Tag Day Foundation was created')) throw new Error('History answer missing: '+historyText);
            console.log('WEBKIT_MOBILE_FOUNDER_PASS=true');
            console.log(founderText);
            console.log('WEBKIT_MOBILE_HISTORY_PASS=true');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test.js
