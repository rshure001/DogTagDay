name: Build and preview EverythingHub (free)

on:
  push:
    branches: [everythinghub-cloudflare-migration]
    paths:
      - 'everythinghub-cloudflare/**'
      - '.github/workflows/everythinghub-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everythinghub-free-preview
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: everythinghub-cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: everythinghub-cloudflare-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: everythinghub-cloudflare/package.json
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Deploy free temporary preview (no account or payment required)
        run: |
          set -o pipefail
          npx --yes netlify-cli deploy --allow-anonymous --dir=dist --functions=netlify/functions 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\\.netlify\\.app' deploy.log | tail -1)
          if [ -z "$URL" ]; then
            echo "Netlify did not return a preview URL."
            exit 1
          fi
          echo "## EverythingHub temporary preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep built files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-build
          path: everythinghub-cloudflare/dist
          retention-days: 7
