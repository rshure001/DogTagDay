name: Build EverythingHub preview

on:
  push:
    branches: [everythinghub-cloudflare-migration]
    paths:
      - 'everythinghub-cloudflare/**'
      - '.github/workflows/everythinghub-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: everythinghub-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: everythinghub-preview-dist
          path: everythinghub-cloudflare/dist
