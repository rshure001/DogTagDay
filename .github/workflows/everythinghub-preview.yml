name: Build and deploy EverythingHub

on:
  push:
    branches: [everythinghub-cloudflare-migration]
    paths:
      - 'everythinghub-cloudflare/**'
      - '.github/workflows/everythinghub-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everythinghub-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: everythinghub-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: everythinghub-cloudflare/package.json
      - run: npm install
      - run: npm run build
      - name: Upload verified static build
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-build
          path: everythinghub-cloudflare/dist
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Build verified. Deployment skipped: Cloudflare credentials are not configured."
            exit 0
          fi
          npx wrangler pages deploy dist --project-name everythinghub-preview
