name: Fix Live Website Counter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-website-counter.yml'
permissions:
  contents: write
jobs:
  fix-counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair website view counter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""<script>(function(){var el=document.getElementById('websiteVisits'),key='dogtagday-org-visits-20260905',seen='dogtagday_visit_counted_20260905',base='https://countapi.mileshilliard.com/api/v1/';var action;try{action=localStorage.getItem(seen)?'get/':'hit/'}catch(e){action='hit/'}fetch(base+action+key,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('counter unavailable');return r.json()}).then(function(data){el.textContent=Number(data.value||0).toLocaleString();try{localStorage.setItem(seen,'1')}catch(e){}}).catch(function(){el.textContent='Counting now'})})();</script>"""
          new="""<script>(function(){var el=document.getElementById('websiteVisits'),key='dogtagday-org-visits-20260905',url='https://countapi.mileshilliard.com/api/v1/hit/'+key;function show(v){var n=Number(v);if(Number.isFinite(n)){el.textContent=n.toLocaleString();return true}return false}function request(){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('counter unavailable');return r.json()}).then(function(data){if(!show(data.value))throw new Error('invalid counter value')})}request().catch(function(){setTimeout(function(){request().catch(function(){el.textContent='Temporarily unavailable'})},1200)})})();</script>"""
          if old not in s:
              raise SystemExit('Expected counter block not found; source left unchanged')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit repaired counter to main
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix website view counter"
          git push origin HEAD:main
