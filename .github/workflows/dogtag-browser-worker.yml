name: Start Dog Tag Day Browser

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Dog Tag Day
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/runtime-worker/package-lock.json

      - name: Install worker
        working-directory: browser/runtime-worker
        run: npm ci

      - name: Build worker
        working-directory: browser/runtime-worker
        run: npm run build

      - name: Get short-lived Dog Tag Day runtime identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dogtag-browser")"
          TOKEN="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)" "$RESPONSE")"
          echo "DOGTAG_RUNTIME_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Start Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on runner' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dogtag-profile"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --user-data-dir="$RUNNER_TEMP/dogtag-profile" \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --no-first-run \
            --no-default-browser-check \
            about:blank >"$RUNNER_TEMP/dogtag-chrome.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dogtag-chrome.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dogtag-chrome.log" || true
          exit 1

      - name: Run Dog Tag Day browser worker
        working-directory: browser/runtime-worker
        env:
          DOGTAG_CONNECTOR_URL: https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtag-browser-runtime
          DOGTAG_CDP_URL: http://127.0.0.1:9222
          DOGTAG_POLL_MS: '1200'
        run: npm start
