name: Dog Tag Day Publisher Health Check

on:
  workflow_dispatch:
  schedule:
    # Check status every three hours; do not trigger another publish cycle.
    - cron: "17 */3 * * *"

permissions:
  contents: read

jobs:
  publisher-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check publisher authorization and recent publishing results
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai"
          echo "Checking Dog Tag Day publisher status..."
          curl --fail --silent --show-error --max-time 20 "$BASE/api/status" -o status.json
          python - <<'PY'
          import json, sys
          with open("status.json", encoding="utf-8") as f:
              data = json.load(f)
          print(json.dumps(data, indent=2))
          # Actual engine response uses data["platforms"] with boolean readiness values.
          platforms = data.get("platforms", {})
          blockers = [name for name in ("facebook", "instagram", "tiktok", "youtube")
                      if platforms.get(name) is not True]
          if blockers:
              print("AUTHORIZATION BLOCKERS: " + ", ".join(blockers))
          history = data.get("history", [])
          if history:
              latest = history[0]
              print("Latest cycle record:", json.dumps(latest, sort_keys=True))
              results = latest.get("results", {})
              failed = [name for name, result in results.items()
                        if isinstance(result, dict) and result.get("ok") is False]
              if failed:
                  print("LATEST CYCLE FAILURES: " + ", ".join(failed))
          else:
              print("No publishing history returned by status endpoint.")
          if blockers:
              sys.exit(1)
          print("Credentials appear present according to engine readiness flags; this does not by itself prove posts are live.")
          PY
