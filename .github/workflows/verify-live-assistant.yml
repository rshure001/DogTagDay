name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify current homepage on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage(); let ok=false;
            const expectedBuild='2026-09-17-final-v58';
            const expectedCamera='c8bf4eab-3376-4f58-8bbf-1b55f0f009f3.png';
            try {
              for(let i=0;i<20;i++){
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                const build=await page.locator('html').getAttribute('data-dtd-build');
                const heroCount=await page.locator('.hero img').count();
                const founderImgs=page.locator('#founder .foundergrid img');
                const founderImageCount=await founderImgs.count();
                const cameraSrc=founderImageCount>1 ? await founderImgs.nth(1).getAttribute('src') : '';
                const counter=(await page.locator('.counter-note').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
                const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
                const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
                const result={attempt:i+1,build,broken,heroCount,founderImageCount,cameraSrc,counter,noOverflow};
                console.log(JSON.stringify(result));
                if(build===expectedBuild && broken.length===0 && heroCount===1 && founderImageCount===2 && cameraSrc.includes(expectedCamera) && counter.includes('4,892') && noOverflow){ok=true;break;}
                await page.waitForTimeout(3000);
              }
            } finally {
              await page.screenshot({path:'live-homepage-mobile.png',fullPage:true}).catch(()=>{});
              await browser.close();
            }
            if(!ok) process.exit(1);
            console.log('LIVE_ASSISTANT_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-mobile
          path: live-homepage-mobile.png
