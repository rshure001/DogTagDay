name: Verify Live Assistant
on:
  workflow_run:
    workflows: ["Deploy Dog Tag Day Now"]
    types: [completed]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify live site on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.route('**/dogtagday-counter', route => route.abort());
            let homepageOk=false;
            try {
              for(let i=0;i<5;i++){
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                const build=await page.locator('html').getAttribute('data-dtd-build');
                const heroCount=await page.locator('.hero img').count();
                const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
                const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1);
                const recruitSrcs=await page.locator('img').evaluateAll(imgs=>imgs.map(i=>i.getAttribute('src')||''));
                const recruitOk=recruitSrcs.some(s=>s.includes('assets/recruits-corrected-tags-20260919.png'));
                const buildOk=/^2026-09-23-final-v\d+$/.test(build||'');
                console.log(JSON.stringify({page:'home',attempt:i+1,build,buildOk,broken,heroCount,noOverflow,recruitOk}));
                if(buildOk && broken.length===0 && heroCount===1 && recruitOk && noOverflow){homepageOk=true;break;}
                await page.waitForTimeout(3000);
              }
              if(!homepageOk) throw new Error('Homepage verification failed');

              await page.goto('https://dogtagday.org/donate.html?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              const donateText=(await page.locator('body').innerText()).replace(/\s+/g,' ');
              const paypalHref=await page.locator('#paypalDonate').getAttribute('href');
              const donateOk=donateText.includes('Honor a Veteran Today') &&
                (paypalHref||'').startsWith('https://www.paypal.com/paypalme/ronnieshure');
              console.log(JSON.stringify({page:'donate',donateOk,paypalHref}));
              if(!donateOk) throw new Error('Donation page verification failed');

              await page.goto('https://dogtagday.org/letter-to-president.html?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
              const letterBuild=await page.locator('html').getAttribute('data-dtd-build');
              const letterText=(await page.locator('body').innerText()).replace(/\s+/g,' ');
              const letterOk=letterBuild==='2026-09-17-open-letter-v53' && letterText.includes('Founder & CEO') && letterText.includes('September 16, 2026');
              console.log(JSON.stringify({page:'letter',letterBuild,letterOk}));
              if(!letterOk) throw new Error('Open-letter page verification failed');
            } finally {
              await page.goto('https://dogtagday.org/?screenshot='+Date.now(),{waitUntil:'networkidle',timeout:30000}).catch(()=>{});
              await page.screenshot({path:'live-homepage-mobile.png',fullPage:true}).catch(()=>{});
              await browser.close();
            }
            console.log('LIVE_ASSISTANT_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-mobile
          path: live-homepage-mobile.png
