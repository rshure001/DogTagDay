name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify dogtagday.org assistant
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            let ok=false,last='';
            for(let n=0;n<10&&!ok;n++){
              try{
                await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                const hard=await page.locator('#hardAsk').count();
                if(!hard) throw new Error('hardAsk missing');
                await page.locator('#hardAsk').click();
                await page.locator('#hardInput').fill('When did Dog Tag Day start?');
                await page.locator('#hardSend').click();
                last=await page.locator('#hardAnswer').innerText();
                ok=last.includes('You asked: When did Dog Tag Day start?') && last.includes('Dog Tag Day Foundation was created');
              }catch(e){last=e.message}
              if(!ok) await new Promise(r=>setTimeout(r,15000));
            }
            console.log(last);
            await page.screenshot({path:'live-assistant.png',fullPage:true});
            await browser.close();
            if(!ok) process.exit(1);
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-assistant-proof
          path: live-assistant.png