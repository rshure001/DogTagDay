name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify and capture all 7 pages on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage(); let failed=false;
            try {
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:45000});
              const marker=await page.locator('html').getAttribute('data-dtd-build');
              const pages=await page.locator('.page').count();
              const imgs=await page.locator('img').evaluateAll(list=>list.map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,h:i.naturalHeight,visible:!!(i.offsetWidth||i.offsetHeight||i.getClientRects().length)})));
              const broken=imgs.filter(i=>i.visible && (!i.w || !i.h));
              if(marker!=='2026-09-16-seven-page-book-v4'||pages!==7||broken.length) failed=true;
              for(let n=1;n<=7;n++){
                await page.screenshot({path:`page-${n}.png`,fullPage:true});
                if(n<7){await page.locator('#next').click(); await page.waitForTimeout(450);}
              }
            } catch(e){console.error(e);failed=true;} finally {await browser.close();}
            if(failed) process.exit(1); console.log('LIVE_ASSISTANT_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-all-pages
          path: page-*.png
