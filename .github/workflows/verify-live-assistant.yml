name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify expanded Ask page on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.goto('https://dogtagday.org/ask.html?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            const tests=[
              ['Is Dog Tag Day a nonprofit corporation?','Dog Tag Day Foundation is the organization behind Dog Tag Day'],
              ['Why did Ronnie create this instead of just supporting Veterans Day?','Ronnie Shure is the Founder & President'],
              ['What is the deeper mission and what are you trying to accomplish nationally?','The mission of Dog Tag Day is to keep veterans and service members from fading into the background'],
              ['Why should a family care about a set of old dog tags after a veteran dies?','Military families and loved ones belong in Dog Tag Day'],
              ['What can a company, school, or community actually do to support this movement?','Participation can be simple and personal'],
              ['Suppose I have never served and know nothing about the military. Why should April 18 matter to me?','Dog Tag Day is observed on April 18 each year']
            ];
            for(const [question,expected] of tests){
              await page.locator('#q').fill(question);
              await page.getByRole('button',{name:'Ask'}).click();
              const answer=await page.locator('#a').innerText();
              if(!answer.includes('You asked: '+question)) throw new Error('QUESTION NOT SHOWN: '+answer);
              if(!answer.includes(expected)) throw new Error(question+' FAILED: '+answer);
              console.log('PASS: '+question+' => '+answer.replace(/\n/g,' '));
            }
            await page.locator('#q').fill('Why should a family care about a set of old dog tags after a veteran dies?');
            await page.getByRole('button',{name:'Ask'}).click();
            await page.screenshot({path:'live-assistant-depth-proof.png',fullPage:true});
            await browser.close();
            console.log('MOBILE_WEBKIT_DEPTH_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-assistant-depth-proof
          path: live-assistant-depth-proof.png