name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify homepage support section and holiday accent on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:30000});
            const body=await page.locator('body').innerText();
            const support=body.includes('Help Build Dog Tag Day') && body.includes('Become a Sponsor') && body.includes('Fund the Mission') && body.includes('Partner With Us');
            const hero=await page.locator('.hero-frame img').getAttribute('src');
            const accent=await page.locator('.hero-frame [aria-label]').count();
            console.log('SUPPORT_VISIBLE='+support);
            console.log('HERO_SRC='+hero);
            console.log('HOLIDAY_ACCENT_COUNT='+accent);
            await page.screenshot({path:'live-homepage-proof.png',fullPage:true});
            await browser.close();
            if(!support || !hero || !hero.includes('approved-dog-tags.PNG')) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png