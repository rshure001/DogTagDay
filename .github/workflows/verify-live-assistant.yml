name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify dogtagday.org Ask page on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            await page.goto('https://dogtagday.org/ask.html?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            const tests=[
              ['What is the mission of Dog Tag Day?','Dog Tag Day is a national movement built around one simple idea'],
              ['Tell me about the founder','Ronnie Shure is the Founder & President'],
              ['Why do dog tags matter?','Dog tags are more than pieces of metal'],
              ['How is this different from Veterans Day?','Veterans Day and Memorial Day are sacred American observances'],
              ['Can families participate?','Families and loved ones are part of Dog Tag Day too'],
              ['How can I participate?','On April 18, if you served, wear your dog tags']
            ];
            for(const [question,expected] of tests){
              await page.locator('#q').fill(question);
              await page.getByRole('button',{name:'Ask'}).click();
              const answer=await page.locator('#a').innerText();
              if(!answer.includes(expected)) throw new Error(question+' FAILED: '+answer);
              console.log('PASS: '+question);
            }
            await page.screenshot({path:'live-assistant.png',fullPage:true});
            await browser.close();
            console.log('MOBILE_WEBKIT_ASK_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-assistant-proof
          path: live-assistant.png