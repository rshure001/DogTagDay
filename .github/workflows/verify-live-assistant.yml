name: Verify Live Assistant
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Verify current homepage on mobile WebKit
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage(); let failed=false;
            try {
              await page.goto('https://dogtagday.org/?verify='+Date.now(),{waitUntil:'networkidle',timeout:45000});
              const marker=await page.locator('html').getAttribute('data-dtd-build');
              const imgs=await page.locator('img').evaluateAll(list=>list.map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,h:i.naturalHeight,visible:!!(i.offsetWidth||i.offsetHeight||i.getClientRects().length)})));
              const broken=imgs.filter(i=>i.visible && (!i.w || !i.h));
              const required=['dog-tag-day-hero.PNG','dtd-home-visual.jpg','dog-tag-day-national-map-brighter-20260913.jpg','honor-jar-click-pledge.png'];
              const missing=required.filter(x=>!imgs.some(i=>String(i.src||'').includes(x)));
              const layout=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth,bodyText:document.body.innerText}));
              const noOverflow=layout.scrollWidth<=layout.innerWidth+2;
              const phrase=layout.bodyText.includes('Put them on. Acknowledge one.') && layout.bodyText.includes('4,304');
              console.log(JSON.stringify({marker,imgs,broken,missing,noOverflow,phrase},null,2));
              if(marker!=='2026-09-16-approved-visual-v5'||broken.length||missing.length||!noOverflow||!phrase) failed=true;
            } catch(e){console.error(e);failed=true;} finally {await page.screenshot({path:'live-homepage-proof.png',fullPage:true}); await browser.close();}
            if(failed) process.exit(1); console.log('LIVE_ASSISTANT_PASS=true');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-proof
          path: live-homepage-proof.png
