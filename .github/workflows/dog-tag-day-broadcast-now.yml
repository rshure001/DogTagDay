name: Dog Tag Day — Broadcast Now

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing Dog Tag Day distributor
        run: |
          set -e
          echo "Triggering Dog Tag Day broadcast bridge..."
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "content-type: application/json" \
            --data '{}' \
            "https://dog-tag-day-kwai-bridge-awybdm.v2.appdeploy.ai/api/run-now"
          echo
          echo "Broadcast request completed."
