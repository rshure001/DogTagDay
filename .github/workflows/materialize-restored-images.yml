name: Materialize Restored Ronnie Photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Materialize exact homepage photos' && github.event.head_commit.message != 'Publish corrected Ronnie conversation photo' && github.event.head_commit.message != 'Publish approved Ronnie portrait'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize approved homepage photos
        run: |
          set -e
          mkdir -p assets
          python - <<'PY'
          from pathlib import Path
          import base64, re
          pairs = [
              ('.imageparts/final-camera.b64','assets/camera-crew-final-20260916.jpg'),
              ('.imageparts/final-founder.b64','assets/founder-hands-final-20260916.jpg'),
              ('.imageparts/ronnie-approved-portrait.b64','assets/ronnie-approved-portrait.jpg'),
          ]
          for src, dst in pairs:
              if Path(src).exists():
                  s = Path(src).read_text()
                  s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
                  s += '=' * ((4 - len(s) % 4) % 4)
                  Path(dst).write_bytes(base64.b64decode(s, validate=False))
          PY
          file assets/ronnie-approved-portrait.jpg | grep -qi 'JPEG image data'
          test -s assets/ronnie-approved-portrait.jpg
      - name: Commit approved assets
        run: |
          git config user.name 'rshure001'
          git config user.email 'rshure001@yahoo.com'
          git add assets/ronnie-approved-portrait.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish approved Ronnie portrait'
          git push origin HEAD:main
