name: Apply Dog Tag Day Visual Refinements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'Apply v50 camera crew cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v50 camera crew cleanup
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('2026-09-17-final-v49','2026-09-17-final-v50')
          s=s.replace('?v=20260917-v49','?v=20260917-v50')
          old='https://gcdn.picsart.com/editing-temp/7bb97213-09f6-4626-8e0c-f14d1bc2bcdb.png?v=20260917-v50'
          new='https://gcdn.picsart.com/editing-temp/5c61045a-8ab3-4679-859e-4bdddefc3be2.jpeg?v=20260917-v50'
          s=s.replace(old,new)
          old2='https://gcdn.picsart.com/editing-temp/7bb97213-09f6-4626-8e0c-f14d1bc2bcdb.png?v=20260917-v49'
          s=s.replace(old2,new)
          old3='https://gcdn.picsart.com/editing-temp/7bb97213-09f6-4626-8e0c-f14d1bc2bcdb.png'
          s=s.replace(old3,new)
          p.write_text(s)
          PY
      - name: Commit v50 cleanup
        run: |
          git config user.name 'rshure001'
          git config user.email 'rshure001@yahoo.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply v50 camera crew cleanup'
          git push origin HEAD:main
