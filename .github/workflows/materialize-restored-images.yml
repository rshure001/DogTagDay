name: Materialize Restored Ronnie Photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Materialize exact homepage photos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode exact approved homepage photos
        run: |
          set -e
          mkdir -p assets
          python - <<'PY'
          from pathlib import Path
          import base64, re
          pairs = [
              ('.imageparts/final-camera.b64','assets/camera-crew-final-20260916.jpg'),
              ('.imageparts/final-founder.b64','assets/founder-hands-final-20260916.jpg'),
          ]
          for src, dst in pairs:
              s = Path(src).read_text()
              s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
              s += '=' * ((4 - len(s) % 4) % 4)
              Path(dst).write_bytes(base64.b64decode(s, validate=False))
          PY
          file assets/camera-crew-final-20260916.jpg | grep -qi 'JPEG image data'
          file assets/founder-hands-final-20260916.jpg | grep -qi 'JPEG image data'
          test -s assets/camera-crew-final-20260916.jpg
          test -s assets/founder-hands-final-20260916.jpg
      - name: Commit exact assets
        run: |
          git config user.name 'rshure001'
          git config user.email 'rshure001@yahoo.com'
          git add assets/camera-crew-final-20260916.jpg assets/founder-hands-final-20260916.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize exact homepage photos'
          git push origin HEAD:main
