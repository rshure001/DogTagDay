ient addresses are not shown</small></div></div><a class="home" href="index.html">Dog Tag Day Home</a><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{minZoom:3,maxZoom:11,zoomControl:true,scrollWheelZoom:true,touchZoom:true,dragging:true,preferCanvas:false}).setView([38.6,-96.5],4);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:11,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);let seed=4182026;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}const poly=[[-124.7,48.8],[-124.1,45.5],[-124.3,42],[-122.5,38],[-120.2,35],[-117.1,32.5],[-111.1,31.3],[-106.5,31.8],[-103,29.7],[-99,26.1],[-96.5,26],[-94,28.8],[-90.5,29],[-88,30.2],[-85,29.7],[-82,25.1],[-80,26],[-80.1,32.3],[-77,35],[-76,38.5],[-74,40.5],[-71,41.5],[-69.8,44],[-72.5,45.2],[-79,43.5],[-83,46],[-89,47],[-95,49],[-110,49]];const hubs=[[47.61,-122.33],[45.52,-122.68],[37.77,-122.42],[38.58,-121.49],[36.17,-115.14],[34.05,-118.24],[32.72,-117.16],[33.45,-112.07],[39.53,-119.81],[40.76,-111.89],[39.74,-104.99],[35.08,-106.65],[32.78,-96.8],[29.76,-95.37],[30.27,-97.74],[29.42,-98.49],[35.47,-97.52],[39.1,-94.58],[38.63,-90.2],[44.98,-93.27],[41.88,-87.63],[43.04,-87.91],[42.33,-83.05],[39.96,-83],[41.5,-81.69],[39.77,-86.16],[36.16,-86.78],[35.15,-90.05],[33.75,-84.39],[30.33,-81.66],[28.54,-81.38],[27.95,-82.46],[25.76,-80.19],[35.23,-80.84],[35.78,-78.64],[37.54,-77.44],[38.91,-77.04],[39.29,-76.61],[39.95,-75.17],[40.71,-74.01],[42.36,-71.06],[41.82,-71.41],[42.89,-78.88],[40.44,-79.99],[38.25,-85.76],[33.52,-86.81],[34.75,-92.29],[41.26,-95.93],[41.59,-93.62],[43.54,-96.73],[46.88,-96.79],[45.78,-108.5],[43.62,-116.2],[32.22,-110.97],[31.76,-106.49],[38.83,-104.82],[36.15,-95.99],[37.69,-97.3
