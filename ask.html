<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ask Dog Tag Day</title><style>body{margin:0;background:#07111b;color:#fff;font-family:Arial,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px 80px}.card{background:#102131;border:2px solid #d9b45a;border-radius:16px;padding:18px}.back{display:inline-block;margin-bottom:18px;color:#d9b45a;font-weight:800;text-decoration:none}h1{margin-top:0}.row{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:14px;font-size:16px;border-radius:8px;border:0}button{background:#d9b45a;color:#07111b;border:0;border-radius:8px;padding:14px 18px;font-weight:900;font-size:16px;-webkit-appearance:none;appearance:none}.answer{margin-top:16px;background:#07111b;border-radius:10px;padding:16px;min-height:110px;line-height:1.5;white-space:pre-wrap}</style></head><body><main><a class="back" href="index.html">← Back to Dog Tag Day</a><div class="card"><h1>Ask Dog Tag Day</h1><p>Type a question about Dog Tag Day and tap Ask.</p><div class="row"><input id="q" type="text" autocomplete="off" placeholder="Ask a question"><button type="button" onclick="answerDogTag()">Ask</button></div><div id="a" class="answer">Hi. Ask me about Dog Tag Day.</div></div></main><script>function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function answerDogTag(){var i=document.getElementById('q'),o=document.getElementById('a'),original=(i.value||'').replace(/^\s+|\s+$/g,''),q=original.toLowerCase(),r='';if(!q){r='Type a question and I will answer it here.'}else if(q.indexOf('founder')>-1||q.indexOf('ronnie')>-1||q.indexOf('shure')>-1){r='Ronnie Shure is the Founder & President of Dog Tag Day Foundation and a U.S. Army veteran. He created Dog Tag Day to help veterans and service members be seen, heard, remembered, and recognized through the dog tags that represent their military service.'}else if((q.indexOf('when')>-1&&(q.indexOf('start')>-1||q.indexOf('begin')>-1||q.indexOf('found')>-1))||q.indexOf('history')>-1){r='Dog Tag Day Foundation was created to establish April 18 as Dog Tag Day — a national day for veterans and service members to wear their dog tags, make military service visible, and keep the stories behind the tags alive.'}else if(q.indexOf('april')>-1||q.indexOf('18')>-1||q.indexOf('wear')>-1){r='On April 18, wear your dog tags if you served. If you see someone wearing tags, acknowledge them. With permission, share a photo, video, or story.'}else if(q.indexOf('story')>-1||q.indexOf('share')>-1){r='Use Share a Story on the homepage to tell the story behind the tags.'}else{r='I can answer questions about Dog Tag Day, April 18, the founder, wearing dog tags, and sharing a story.'}o.innerHTML='<strong>You asked:</strong> '+esc(original)+'<br><br>'+esc(r)}document.getElementById('q').onkeyup=function(e){e=e||window.event;if((e.key&&e.key==='Enter')||e.keyCode===13){answerDogTag();return false}}</script></body></html>
