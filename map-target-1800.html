<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Dog Tag Day | National Outreach Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#wrap,#map{height:100%;margin:0}
html,body{background:#02050a;font-family:Arial,sans-serif;color:#fff}
#wrap{position:relative;overflow:hidden;background:#02050a}
#map,.leaflet-container{background:#02050a}
.leaflet-control-attribution{font-size:7px!important;opacity:.55}
.leaflet-control-zoom a{background:#06101a!important;color:#fff!important;border-color:#8e7847!important}
.top{position:absolute;z-index:1000;left:8px;right:8px;top:8px;padding:8px 10px;background:#02050aee;border:1px solid #c7a65b;border-radius:9px;font-weight:800;letter-spacing:.055em;font-size:12px;box-shadow:0 4px 20px #000}
.top small{display:block;margin-top:3px;color:#d7dbe0;font-weight:400;letter-spacing:0}
.top .count{color:#ffd15b;font-weight:900}
.home{position:absolute;z-index:1001;left:8px;bottom:8px;padding:7px 9px;border:1px solid #c7a65b;border-radius:7px;background:#02050aee;color:#fff;text-decoration:none;font-size:12px}
.instruction{position:absolute;z-index:1000;right:8px;bottom:8px;padding:7px 9px;border:1px solid #496d86;border-radius:7px;background:#02050add;color:#eaf7ff;font-size:11px;pointer-events:none}
.insets{position:absolute;z-index:900;left:8px;bottom:48px;display:flex;gap:5px}
.inset{width:88px;height:54px;border:1px solid #8f7847;border-radius:4px;overflow:hidden;background:#02050a;position:relative;box-shadow:0 2px 8px #000}
.inset-map{width:100%;height:100%}.inset b{position:absolute;z-index:500;left:4px;bottom:2px;font-size:8px;letter-spacing:.06em;text-shadow:0 1px 3px #000}
.hot{position:relative;width:6px;height:6px;border-radius:50%;background:#fffbe3;box-shadow:0 0 3px #fff,0 0 7px #ffd15b,0 0 13px #ff6b35,0 0 20px #ff382d}
.hot:before,.hot:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffe2a8;opacity:.75}.hot:before{width:1px;height:20px}.hot:after{height:1px;width:20px}
@media(max-width:600px){.top{font-size:10px}.top small{font-size:9px}.inset{width:69px;height:43px}.home{font-size:11px}.instruction{bottom:46px;right:7px;max-width:138px;text-align:right}}
</style>
</head>
<body>
<div id="wrap">
<div id="map"></div>
<div class="top">DOG TAG DAY • NATIONAL OUTREACH MAP<small><span class="count">1,800 outreach lights</span> • approximate campaign-reach locations • zoom in anywhere in America • exact recipient addresses are not displayed</small></div>
<div class="insets"><div class="inset"><div id="ak" class="inset-map"></div><b>ALASKA</b></div><div class="inset"><div id="hi" class="inset-map"></div><b>HAWAII</b></div><div class="inset"><div id="pr" class="inset-map"></div><b>PUERTO RICO</b></div></div>
<a class="home" href="index.html">Dog Tag Day Home</a><div class="instruction">Pinch or use + to zoom to your community</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const tile='https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
const attr='&copy; OpenStreetMap &copy; CARTO';
let seed=4182026;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const poly=[[-124.8,48.8],[-124.2,42],[-117.1,32.5],[-111,31.3],[-106.5,31.8],[-103,29.7],[-99,26],[-96,26],[-94,29],[-90,29],[-85,30],[-82,25],[-80,26],[-80,32],[-77,35],[-76,39],[-74,40.5],[-70,42],[-69.8,44],[-72.5,45.2],[-79,43.5],[-83,46],[-89,47],[-95,49],[-110,49]];
function inside(x,y){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
const hubs=[[47.61,-122.33,18],[45.52,-122.68,10],[37.77,-122.42,22],[38.58,-121.49,10],[36.17,-115.14,24],[34.05,-118.24,30],[32.72,-117.16,14],[33.45,-112.07,13],[40.76,-111.89,9],[39.74,-104.99,13],[32.78,-96.80,21],[29.76,-95.37,17],[30.27,-97.74,10],[29.42,-98.49,10],[35.47,-97.52,8],[39.10,-94.58,9],[38.63,-90.20,10],[44.98,-93.27,11],[41.88,-87.63,25],[43.04,-87.91,8],[42.33,-83.05,13],[39.96,-83.00,10],[41.50,-81.69,9],[39.77,-86.16,8],[36.16,-86.78,9],[35.15,-90.05,8],[33.75,-84.39,18],[30.33,-81.66,8],[28.54,-81.38,9],[27.95,-82.46,11],[25.76,-80.19,18],[35.23,-80.84,11],[35.78,-78.64,9],[37.54,-77.44,11],[38.91,-77.04,22],[39.29,-76.61,10],[39.95,-75.17,20],[40.71,-74.01,30],[42.36,-71.06,16],[41.82,-71.41,7],[42.89,-78.88,7],[40.44,-79.99,9],[38.25,-85.76,7],[33.52,-86.81,7],[34.75,-92.29,6],[41.26,-95.93,6],[43.54,-96.73,5],[43.62,-116.20,6],[32.22,-110.97,7],[31.76,-106.49,6],[38.83,-104.82,7],[36.15,-95.99,6],[37.69,-97.33,6]];
const warm=['#ffd56a','#ffb347','#ff8a3d','#ff5b35','#ff3b30','#fff0bd','#ffcb6b'];
const accent=['#26dfff','#6d7cff','#ca66ff','#ff4aa2','#78ff67'];
const map=L.map('map',{minZoom:3,maxZoom:18,zoomSnap:.25,zoomControl:true,preferCanvas:true,worldCopyJump:false}).setView([38.2,-96.5],4);
L.tileLayer(tile,{maxZoom:19,maxNativeZoom:19,attribution:attr}).addTo(map);
let pts=[];
while(pts.length<980){const x=-125+rnd()*59,y=24+rnd()*26;if(inside(x,y)){const east=x>-100?1.35:1,ne=x>-85&&y>36?1.25:1,south=y<35?1.12:1;if(rnd()<.43*east*ne*south)pts.push([y,x,0])}}
for(const [lat,lng,n] of hubs){for(let i=0;i<n;i++){const a=rnd()*6.28318,d=.02+Math.sqrt(rnd())*.30;pts.push([lat+Math.sin(a)*d,lng+Math.cos(a)*d/Math.max(.58,Math.cos(lat*.0174533)),1])}}
while(pts.length<1680){const h=hubs[Math.floor(rnd()*hubs.length)],a=rnd()*6.28318,d=.015+Math.sqrt(rnd())*.24;pts.push([h[0]+Math.sin(a)*d,h[1]+Math.cos(a)*d/Math.max(.58,Math.cos(h[0]*.0174533)),1])}
pts=pts.slice(0,1680);
const canvas=L.canvas({padding:.5});
pts.forEach((p,i)=>{const c=i%11===0?accent[i%accent.length]:warm[i%warm.length],rad=p[2]?(i%23===0?3.1:2.0):(i%31===0?2.6:1.6);L.circleMarker([p[0],p[1]],{renderer:canvas,radius:rad,weight:.4,color:'#fff7d6',opacity:.7,fillColor:c,fillOpacity:.98,interactive:false}).addTo(map)});
hubs.filter((_,i)=>i%2===0).slice(0,28).forEach(([lat,lng],i)=>{const d=.03+(i%5)*.006,icon=L.divIcon({className:'',html:'<div class="hot"></div>',iconSize:[6,6],iconAnchor:[3,3]});L.marker([lat+d,lng-d],{icon,interactive:false,keyboard:false}).addTo(map)});
map.fitBounds([[24.2,-125],[49.7,-66.5]],{padding:[8,8]});
function mini(id,center,zoom,count,spread){const mm=L.map(id,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false,preferCanvas:true}).setView(center,zoom);L.tileLayer(tile,{maxZoom:19}).addTo(mm);for(let i=0;i<count;i++){const a=rnd()*6.28318,d=Math.sqrt(rnd())*spread,c=i%9===0?accent[i%accent.length]:warm[i%warm.length];L.circleMarker([center[0]+Math.sin(a)*d,center[1]+Math.cos(a)*d/Math.max(.58,Math.cos(center[0]*.0174533))],{radius:1.2+(i%13===0?.8:0),weight:.3,color:'#fff7d6',fillColor:c,fillOpacity:.98,interactive:false}).addTo(mm)}return mm}
mini('ak',[61.4,-149.4],4,45,2.4);mini('hi',[20.8,-157.8],5,45,1.1);mini('pr',[18.25,-66.4],7,30,.35);
try{
  if(window.parent&&window.parent!==window){
    const section=window.parent.document.querySelector('#home-outreach-map');
    if(section){
      const p=section.querySelector('p[style*="max-width:760px"]');
      if(p)p.textContent='Explore 1,800 approximate national outreach lights. Pinch, zoom, and drag to explore communities across America. Exact recipient addresses are not displayed.';
      const a=section.querySelector('a[href*="map-target-1800.html"]');
      if(a)a.href='map-target-1800.html?v=20260827-final';
    }
  }
}catch(e){}
</script>
</body>
</html>
