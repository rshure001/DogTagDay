<!doctype html>
<html lang="en" data-dtd-map-build="2026-09-08-mobile-focus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Dog Tag Day | Across America Map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050a;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.shell{position:relative;width:100%;height:100%;overflow:hidden;background:#01050a}
.stage{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.mapCanvas{width:100%;min-width:100%;min-height:100%;display:grid;place-items:center;transition:width .16s ease}
.mapCanvas img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.topbar{position:absolute;z-index:10;top:8px;left:8px;right:8px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;pointer-events:none}
.topbar a,.title{pointer-events:auto;border:1px solid rgba(223,186,98,.9);background:rgba(2,9,16,.88);box-shadow:0 2px 12px rgba(0,0,0,.45);backdrop-filter:blur(4px)}
.topbar a{min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 13px;border-radius:999px;color:#fff;text-decoration:none;font-weight:900;font-size:.78rem;letter-spacing:.03em}
.title{min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:999px;text-align:center;color:#dfba62;font-weight:900;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.controls{position:absolute;z-index:10;left:50%;bottom:46px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:6px;border:1px solid rgba(223,186,98,.72);border-radius:999px;background:rgba(2,9,16,.9);box-shadow:0 3px 14px rgba(0,0,0,.5)}
.controls button{appearance:none;border:1px solid #dfba62;background:#143b68;color:#fff;min-width:44px;height:44px;border-radius:999px;font-weight:900;font-size:1.15rem;cursor:pointer}
.controls button:disabled{opacity:.38;cursor:not-allowed}
.controls .reset{min-width:128px;padding:0 16px;background:#dfba62;color:#07131f;font-size:.78rem;letter-spacing:.04em}
.accuracy{position:absolute;z-index:10;left:8px;right:8px;bottom:8px;margin:auto;max-width:760px;padding:7px 12px;border:1px solid rgba(223,186,98,.58);border-radius:999px;background:rgba(2,9,16,.9);color:#dce5ef;text-align:center;font-size:.68rem;line-height:1.25;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){.topbar{top:6px;left:6px;right:6px;gap:5px}.topbar a{min-height:40px;padding:0 10px;font-size:.7rem}.title{min-height:40px;font-size:.68rem;letter-spacing:.08em;padding:0 7px}.controls{bottom:44px}.controls button{min-width:42px;height:42px}.controls .reset{min-width:118px}.accuracy{left:6px;right:6px;bottom:6px;font-size:.62rem;padding:6px 9px}}
</style>
</head>
<body>
<main class="shell" aria-label="Dog Tag Day Across America campaign map">
  <div class="stage" id="stage">
    <div class="mapCanvas" id="mapCanvas">
      <img id="mapImage" src="assets/dog-tag-day-population-centered-map-20260905.jpg?v=20260908-mobile-focus" alt="Dog Tag Day Across America campaign map artwork with multicolored lights and its color key">
    </div>
  </div>
  <div class="topbar" aria-label="Map navigation">
    <a href="index.html#map" target="_top" aria-label="Return to Dog Tag Day home page">← Home</a>
    <div class="title">Across America</div>
    <a href="map.html?v=20260908-mobile-focus" target="_top" aria-label="Open the Across America map full screen">Full Screen</a>
  </div>
  <div class="controls" aria-label="Map zoom controls">
    <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
    <button class="reset" id="resetMap" type="button">Across America</button>
    <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
  </div>
  <div class="accuracy">Campaign visualization • Not proof of send, delivery, open, recipient location, or participation totals.</div>
  <span class="srOnly" id="zoomStatus" aria-live="polite">Map fitted across America.</span>
</main>
<script>
(function(){
  var stage=document.getElementById('stage'),canvas=document.getElementById('mapCanvas'),img=document.getElementById('mapImage');
  var zin=document.getElementById('zoomIn'),zout=document.getElementById('zoomOut'),reset=document.getElementById('resetMap'),status=document.getElementById('zoomStatus');
  var zoom=1;
  function focusPoint(){
    return {
      x:(stage.scrollLeft+stage.clientWidth/2)/Math.max(stage.scrollWidth,stage.clientWidth,1),
      y:(stage.scrollTop+stage.clientHeight/2)/Math.max(stage.scrollHeight,stage.clientHeight,1)
    };
  }
  function restoreFocus(f){
    stage.scrollLeft=Math.max(0,f.x*stage.scrollWidth-stage.clientWidth/2);
    stage.scrollTop=Math.max(0,f.y*stage.scrollHeight-stage.clientHeight/2);
  }
  function apply(next,fitAll){
    var f=fitAll?{x:.5,y:.5}:focusPoint();
    zoom=Math.max(1,Math.min(3,next));
    canvas.style.width=(zoom*100)+'%';
    setTimeout(function(){restoreFocus(f)},170);
    zout.disabled=zoom<=1;
    zin.disabled=zoom>=3;
    status.textContent=zoom===1?'Map fitted across America.':'Map zoom '+Math.round(zoom*100)+' percent. View remains centered on the area you were inspecting.';
  }
  zin.addEventListener('click',function(){apply(zoom+.5,false)});
  zout.addEventListener('click',function(){apply(zoom-.5,false)});
  reset.addEventListener('click',function(){apply(1,true)});
  img.addEventListener('load',function(){apply(1,true)});
  window.addEventListener('resize',function(){if(zoom===1)restoreFocus({x:.5,y:.5})});
  apply(1,true);
})();
</script>
</body>
</html>
