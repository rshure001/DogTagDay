<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Dog Tag Day | Across America</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#030913;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 15%,#102744 0,#06111e 42%,#02060b 100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #8d7843;background:#07131f}.title{min-width:0}.title b{display:block;color:#fff;font-size:clamp(.88rem,2.4vw,1.08rem);letter-spacing:.08em}.title small{display:block;margin-top:3px;color:#dfba62;font-size:.68rem;line-height:1.3}.truth{flex:0 0 auto;border:1px solid #dfba62;border-radius:999px;padding:7px 10px;color:#ffe59a;background:#0b2035;font-size:.67rem;font-weight:900;letter-spacing:.04em}.viewport{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#02070d}.viewport.dragging{cursor:grabbing}.mapAsset{position:absolute;left:50%;top:50%;width:min(96%,700px);height:auto;aspect-ratio:700/467;border:0;background:#01050a;transform:translate(-50%,-50%) translate(0px,0px) scale(1);transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform;filter:drop-shadow(0 14px 28px rgba(0,0,0,.5))}.badge{position:absolute;left:12px;bottom:12px;max-width:min(390px,calc(100% - 24px));padding:8px 10px;border:1px solid rgba(223,186,98,.8);border-radius:8px;background:rgba(3,9,19,.91);color:#dce5ef;font-size:.69rem;line-height:1.35;pointer-events:none}.badge strong{color:#ffe59a}.controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #8d7843;background:#07131f}.controls button{min-width:48px;min-height:44px;border:1px solid #dfba62;border-radius:999px;background:#143b68;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.controls .across{min-width:168px;background:#dfba62;color:#07131f;border:2px solid #fff;font-size:.86rem}.controls button:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(max-width:600px){.top{padding:8px}.truth{font-size:.6rem;padding:6px 8px}.title small{font-size:.62rem}.badge{left:8px;bottom:8px;max-width:calc(100% - 16px);font-size:.64rem}.controls{gap:6px;padding-inline:7px}.controls button{min-width:46px;min-height:46px}.controls .across{flex:1;min-width:0}}
</style>
<style>
.mapAsset{width:min(98%,1100px);aspect-ratio:auto;filter:drop-shadow(0 0 18px rgba(255,179,45,.38)) drop-shadow(0 14px 28px rgba(0,0,0,.5))}
@media(max-width:600px){.mapAsset{width:100%}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="title"><b>DOG TAG DAY • ACROSS AMERICA</b><small>Original map artwork preserved • drag to inspect • use controls to zoom</small></div><div class="truth">VISUAL MAP • NOT DELIVERY PROOF</div></header>
<section class="viewport" id="viewport" aria-label="Dog Tag Day Across America map viewer">
<iframe id="mapAsset" class="mapAsset" src="assets/final-approved-amber-map.html?v=20260905-clear-map" title="Dog Tag Day national outreach map glowing across the United States"></iframe>
<div class="badge"><strong>Verified-record standard:</strong> the lights are campaign artwork. A contact is counted publicly only when a matching sent-email or submission receipt exists.</div>
</section>
<nav class="controls" aria-label="Map controls"><button type="button" id="minus" aria-label="Zoom out">−</button><button type="button" class="across" id="home">Across America</button><button type="button" id="plus" aria-label="Zoom in">+</button></nav>
</main>
<script>
(function(){
  const img=document.getElementById('mapAsset'),v=document.getElementById('viewport');
  let scale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0;
  function clamp(){scale=Math.max(1,Math.min(3.2,scale));const r=v.getBoundingClientRect();const mx=(r.width*(scale-1))*.42,my=(r.height*(scale-1))*.42;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));}
  function draw(){clamp();img.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;}
  function zoom(d){const old=scale;scale+=d;if(scale<=1){scale=1;x=0;y=0}else{x*=scale/old;y*=scale/old}draw();}
  document.getElementById('plus').onclick=()=>zoom(.28);
  document.getElementById('minus').onclick=()=>zoom(-.28);
  document.getElementById('home').onclick=()=>{scale=1;x=0;y=0;draw();};
  v.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.18:-.18)},{passive:false});
  v.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;v.setPointerCapture(e.pointerId);v.classList.add('dragging')});
  v.addEventListener('pointermove',e=>{if(!drag)return;x=ox+(e.clientX-sx);y=oy+(e.clientY-sy);draw()});
  function stop(){drag=false;v.classList.remove('dragging')}v.addEventListener('pointerup',stop);v.addEventListener('pointercancel',stop);
  window.addEventListener('resize',draw);draw();
  try{
    const d=parent.document,section=d.querySelector('.nationalMapBand');
    if(section){
      const intro=section.querySelector('.mapIntro'),note=section.querySelector('.mapNote'),button=section.querySelector('a[href="map.html"]'),frame=section.querySelector('iframe');
      if(intro)intro.textContent='Across America is a visual outreach overview. The original map artwork is preserved here. It is not a verified send or delivery ledger; outreach totals should only be published from source records.';
      if(note)note.textContent='Map artwork is preserved for campaign presentation. It does not prove an email was sent, delivered, opened, or that a location participated. Use the outreach master log for verified counts.';
      if(button)button.textContent='Open Full-Screen Across America Map';
      if(frame)frame.title='Dog Tag Day Across America map — campaign visualization, not delivery proof';
    }
  }catch(e){}
})();
</script>
</body>
</html>
