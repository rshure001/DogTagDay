<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dog Tag Day | Interactive Map</title>
<style>
html,body{margin:0;height:100%;background:#07131f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column}
.top{padding:14px 18px;background:#07131f;border-bottom:1px solid #b89a55;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top strong{font-size:1.05rem;letter-spacing:.08em}.top span{font-size:.92rem;color:#d7e2ea}.home{color:#fff;text-decoration:none;border:1px solid #b89a55;padding:8px 12px;border-radius:5px}
.frame{flex:1;min-height:520px}.frame iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:700px){.top{padding:10px 12px}.frame{min-height:470px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><strong>DOG TAG DAY INTERACTIVE MAP</strong><br><span>Zoom in, zoom out, drag, and explore the dots across America.</span></div>
    <a class="home" href="index.html">Dog Tag Day Home</a>
  </div>
  <div class="frame"><iframe id="mapframe" src="map.html" title="Dog Tag Day interactive map"></iframe></div>
</div>
<script>
const frame=document.getElementById('mapframe');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const top=doc.querySelector('.map-top');
    if(top) top.style.display='none';
    const note=doc.querySelector('.map-note');
    if(note) note.style.display='none';
    const back=doc.querySelector('.back');
    if(back) back.style.display='none';
    const card=doc.querySelector('.map-card');
    if(card){card.style.marginTop='0';card.style.border='0';card.style.borderRadius='0';}
    const map=doc.querySelector('#map');
    if(map){map.style.height='100vh';map.style.minHeight='520px';}
    const page=doc.querySelector('.map-page');
    if(page){page.style.maxWidth='none';page.style.padding='0';}
  }catch(e){}
});
</script>
</body>
</html>
