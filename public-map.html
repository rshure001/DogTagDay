<!doctype html>
<html lang="en" data-dtd-map-build="2026-09-10-map-legend-only">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Dog Tag Day Map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#01050a;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mapPage{width:100%;max-width:1400px;margin:0 auto;background:#01050a}
.mapWrap{width:100%;overflow:hidden;background:#01050a}
.mapWrap img{display:block;width:100%;height:auto;max-width:100%;user-select:none;-webkit-user-drag:none}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;padding:12px 10px 16px;border-top:1px solid rgba(255,255,255,.15);background:#07111b}
.item{display:flex;align-items:center;gap:6px;color:#fff;font-size:.72rem;font-weight:800;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;box-shadow:0 0 7px rgba(255,255,255,.18)}
.green{background:#2bd35c}.white{background:#d6d6d6}.blue{background:#2387ff}.red{background:#ff3434}.orange{background:#ff8a1f}.purple{background:#9a37e8}.teal{background:#20c5d8}.yellow{background:#ffd329}.pink{background:#ff3c91}.olive{background:#b5c83c}.brown{background:#a36e42}
@media(max-width:600px){.legend{gap:7px 10px;padding:10px 8px 14px}.item{font-size:.64rem}.dot{width:10px;height:10px;flex-basis:10px}}
</style>
</head>
<body>
<main class="mapPage" aria-label="Dog Tag Day outreach map">
  <div class="mapWrap">
    <img src="assets/dog-tag-day-population-centered-map-20260905.jpg?v=20260910-map-only" alt="Dog Tag Day outreach map">
  </div>
  <div class="legend" aria-label="Map color codes">
    <div class="item"><span class="dot green"></span>Grants / Foundations</div>
    <div class="item"><span class="dot white"></span>Attorneys / Legal</div>
    <div class="item"><span class="dot blue"></span>Veterans Organizations</div>
    <div class="item"><span class="dot red"></span>Media / Newsrooms</div>
    <div class="item"><span class="dot orange"></span>First Responders</div>
    <div class="item"><span class="dot purple"></span>Restaurants / Food</div>
    <div class="item"><span class="dot teal"></span>Government / Civic</div>
    <div class="item"><span class="dot yellow"></span>Businesses / Retail</div>
    <div class="item"><span class="dot pink"></span>Faith / Churches</div>
    <div class="item"><span class="dot olive"></span>Sports / Athletics</div>
    <div class="item"><span class="dot brown"></span>Other</div>
  </div>
</main>
</body>
</html>
