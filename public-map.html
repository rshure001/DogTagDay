<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=19,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Dog Tag Day | National Outreach Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;background:#07111b;font-family:Arial,sans-serif}
.leaflet-control-zoom a{background:#07111b!important;color:#fff!important;border-color:#526476!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#07111b;color:#fff}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.82)!important}
.map-status{position:absolute;z-index:800;top:8px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 10px;border:1px solid #d7b464;border-radius:999px;background:rgba(2,6,11,.86);color:#fff;font-size:12px;font-weight:800;letter-spacing:.03em;pointer-events:none}
.map-status b{color:#ffd86b}
@media(max-width:520px){.map-status{top:6px;font-size:10px;padding:5px 8px}.leaflet-control-attribution{font-size:7px!important}}
</style>
</head>
<body>
<div id="map" aria-label="Interactive United States Dog Tag Day outreach map"></div>
<div class="map-status"><b>1,800 lights</b> • pinch or + to see cities</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const canvas=L.canvas({padding:.3});
const map=L.map('map',{minZoom:3,maxZoom:19,zoomControl:true,scrollWheelZoom:true,touchZoom:true,dragging:true,preferCanvas:true,renderer:canvas}).setView([38.6,-96.5],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
let seed=4182026;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
const poly=[[-124.7,48.8],[-124.1,45.5],[-124.3,42],[-122.5,38],[-120.2,35],[-117.1,32.5],[-111.1,31.3],[-106.5,31.8],[-103,29.7],[-99,26.1],[-96.5,26],[-94,28.8],[-90.5,29],[-88,30.2],[-85,29.7],[-82,25.1],[-80,26],[-80.1,32.3],[-77,35],[-76,38.5],[-74,40.5],[-71,41.5],[-69.8,44],[-72.5,45.2],[-79,43.5],[-83,46],[-89,47],[-95,49],[-110,49]];
const hubs=[[47.61,-122.33],[45.52,-122.68],[37.77,-122.42],[38.58,-121.49],[36.17,-115.14],[34.05,-118.24],[32.72,-117.16],[33.45,-112.07],[39.53,-119.81],[40.76,-111.89],[39.74,-104.99],[35.08,-106.65],[32.78,-96.8],[29.76,-95.37],[30.27,-97.74],[29.42,-98.49],[35.47,-97.52],[39.1,-94.58],[38.63,-90.2],[44.98,-93.27],[41.88,-87.63],[43.04,-87.91],[42.33,-83.05],[39.96,-83],[41.5,-81.69],[39.77,-86.16],[36.16,-86.78],[35.15,-90.05],[33.75,-84.39],[30.33,-81.66],[28.54,-81.38],[27.95,-82.46],[25.76,-80.19],[35.23,-80.84],[35.78,-78.64],[37.54,-77.44],[38.91,-77.04],[39.29,-76.61],[39.95,-75.17],[40.71,-74.01]];
const categories=[['Sponsors','#f5c451'],['Charities','#ffffff'],['Veterans Organizations','#ef4056'],['Community Partners','#46a8ff'],['Volunteers','#43d17b'],['Media','#c889ff']];
const pts=[];
while(pts.length<1300){let x=-125+rnd()*58,y=24+rnd()*26;if(inside(x,y,poly)){let keep=.52+(x>-100?.30:0)+(x>-85?.12:0)+(y<35?.08:0);if(rnd()<Math.min(.98,keep))pts.push([y,x])}}
hubs.forEach(([lat,lng])=>{for(let k=0;k<10;k++){const a=rnd()*Math.PI*2,r=.08+Math.sqrt(rnd())*.75;pts.push([lat+Math.sin(a)*r,lng+Math.cos(a)*r/Math.max(.55,Math.cos(lat*Math.PI/180))])}});
for(let i=0;i<50;i++)pts.push([58.5+rnd()*5,-151.5+rnd()*8]);
for(let i=0;i<50;i++)pts.push([19.2+rnd()*3.2,-160.2+rnd()*5.6]);
const markers=[];
pts.forEach(([lat,lng],i)=>{const [category,color]=categories[i%categories.length];const marker=L.circleMarker([lat,lng],{renderer:canvas,radius:1.35,color:'#ffffff',weight:.3,opacity:.85,fillColor:color,fillOpacity:.88}).addTo(map).bindPopup('<strong>'+category+'</strong><br>Dog Tag Day outreach visualization near this area.<br><small>Illustrative—not an exact recipient address.</small>');markers.push(marker)});
function sharpen(){const z=map.getZoom();const radius=z<=4?1.35:z<=7?2.25:z<=10?3.25:4.25;const weight=z<=5?.3:.65;markers.forEach(m=>m.setStyle({radius,weight,fillOpacity:z<=4?.82:.94}))}
map.on('zoomend',sharpen);
map.fitBounds([[18.5,-161.5],[63.8,-68]],{padding:[10,10]});
sharpen();
</script>
</body>
</html>
