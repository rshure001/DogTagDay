name = "dog-tag-day-super-house"
main = "super-house-worker.js"
compatibility_date = "2026-10-03"

[assets]
directory = "./super-house"

[[queues.producers]]
queue = "dog-tag-day-broadcast"
binding = "BROADCAST_QUEUE"

[[queues.consumers]]
queue = "dog-tag-day-broadcast"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "dog-tag-day-broadcast-dlq"

[vars]
SUPER_HOUSE_VERSION = "1.2.2-browser-relay"

[[durable_objects.bindings]]
name = "BROWSER_RELAY"
class_name = "BrowserRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserRelay"]
