<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dog Tag Day Swipe Story</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050a12;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.app{height:100svh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 14px 0;background:#07111bf2;border-bottom:1px solid #ffffff20}.brand{font-weight:900}.brand span{color:#d9b45a}.music{border:0;border-radius:999px;background:#d9b45a;color:#07111b;font-weight:900;padding:10px 14px}.count{font-size:13px;opacity:.8}.viewport{position:relative;flex:1;overflow:hidden}.track{height:100%;display:flex;transition:transform .32s ease}.page{min-width:100%;height:100%;padding:14px 14px 78px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0b1626,#050a12)}.frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}.frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:18px;box-shadow:0 18px 50px #0008;background:#111}.caption{position:absolute;left:18px;right:18px;bottom:18px;background:#07111bd9;border:1px solid #ffffff2b;border-radius:16px;padding:12px 14px;font-weight:900;text-align:center}.controls{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#050a12 45%)}.btn{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff17;color:#fff;font-size:26px;font-weight:900}.btn:disabled{opacity:.25}.dots{display:flex;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#ffffff44}.dot.on{background:#d9b45a;transform:scale(1.35)}#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000e;z-index:99;padding:18px}#modal.open{display:flex}#box{width:min(900px,96vw);background:#07111b;border:2px solid #d9b45a;border-radius:18px;overflow:hidden}#head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:900}#close{width:38px;height:38px;border-radius:50%;border:0;background:#d9b45a;font-size:21px;font-weight:900}iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}</style></head><body><div class="app"><div class="top"><div><div class="brand">DOG <span>TAG</span> DAY</div><div class="count" id="count">1 / 5</div></div><button class="music" id="music">♪ Play Music</button></div><div class="viewport" id="viewport"><div class="track" id="track"><section class="page"><div class="frame"><img src="https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/dog-tag-day-hero-unique-20260906.jpg" alt="Dog Tag Day hero"><div class="caption">DOG TAG DAY • APRIL 18</div></div></section><section class="page"><div class="frame"><img src="https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/dog-tag-day-civilian-veterans-silencers-20260912.png" alt="Veterans in civilian life"><div class="caption">THE UNIFORM COMES OFF. THE SERVICE DOES NOT.</div></div></section><section class="page"><div class="frame"><img src="https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/dog-tag-day-five-no-hats.webp" alt="Veterans"><div class="caption">WE LISTEN. WE STAY.</div></div></section><section class="page"><div class="frame"><img src="https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/approved-dog-tags.PNG" alt="Approved Dog Tag Day tags"><div class="caption">EVERY SET OF TAGS TELLS A STORY.</div></div></section><section class="page"><div class="frame"><img src="https://raw.githubusercontent.com/rshure001/DogTagDay/main/assets/dog-tag-day-hero.PNG" alt="Dog Tag Day"><div class="caption">YOU SERVED. YOU STILL MATTER. • DOGTAGDAY.ORG</div></div></section></div><div class="controls"><button class="btn" id="prev">‹</button><div class="dots" id="dots"></div><button class="btn" id="next">›</button></div></div></div><div id="modal"><div id="box"><div id="head"><span>Patriotic Military Music</span><button id="close">×</button></div><iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div><script>const track=document.getElementById('track'),vp=document.getElementById('viewport'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots');let i=0,sx=0,dx=0;for(let n=0;n<5;n++){let d=document.createElement('span');d.className='dot';dots.appendChild(d)}function r(){track.style.transform=`translateX(${-i*100}%)`;count.textContent=`${i+1} / 5`;prev.disabled=i===0;next.disabled=i===4;[...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i))}function go(n){i=Math.max(0,Math.min(4,n));r()}prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1);vp.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0},{passive:true});vp.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx},{passive:true});vp.addEventListener('touchend',()=>{if(Math.abs(dx)>45)go(i+(dx<0?1:-1))});const modal=document.getElementById('modal'),player=document.getElementById('player');document.getElementById('music').onclick=()=>{player.src='https://www.dvidshub.net/video/embed/485738';modal.classList.add('open')};document.getElementById('close').onclick=()=>{player.src='about:blank';modal.classList.remove('open')};modal.onclick=e=>{if(e.target===modal){player.src='about:blank';modal.classList.remove('open')}};r();</script></body></html>
