*{box-sizing:border-box}html,body{margin:0;padding:0;background:#06111b;color:#fff;font-family:Arial,Helvetica,sans-serif}.shell{max-width:1600px;margin:0 auto;padding:10px}.top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;margin-bottom:10px}.tags{border:1px solid #c5a04a;border-radius:12px;overflow:hidden;background:#02080d;min-height:120px}.tags img{width:100%;height:100%;object-fit:cover;object-position:left center;display:block}.hero{border:1px solid #354b60;border-radius:12px;background:linear-gradient(135deg,#0d2235,#07121d);padding:12px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;color:#d7b25b}.hero h1{font-size:clamp(28px,6vw,52px);line-height:.95;margin:4px 0 8px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:13px 14px;font-size:16px;border:0;border-radius:10px;color:#111}.search button{border:0;border-radius:10px;background:#d7b25b;color:#111;padding:0 18px;font-weight:900}.mapbox{border:2px solid #d7b25b;border-radius:12px;overflow:hidden;background:#000}#map{height:78vh;min-height:560px;touch-action:pan-x pan-y}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#07111b;color:#fff}.leaflet-control-zoom a{background:#07111b!important;color:#fff!important}.leaflet-control-attribution{font-size:9px!important}.legend-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(3,10,16,.86);border:1px solid #33495c;padding:5px 7px;border-radius:999px;margin:2px}.legend-wrap{position:absolute;z-index:500;left:10px;bottom:10px;max-width:calc(100% - 20px)}.sw{width:9px;height:9px;border-radius:50%;display:inline-block}.private{position:absolute;z-index:500;right:10px;top:10px;background:rgba(0,0,0,.76);border:1px solid #d7b25b;color:#d7b25b;padding:6px 8px;border-radius:7px;font-weight:800;font-size:11px}.count{position:absolute;z-index:500;left:10px;top:10px;background:rgba(0,0,0,.76);border:1px solid #d7b25b;color:#fff;padding:6px 8px;border-radius:7px;font-weight:800;font-size:11px}@media(max-width:700px){.top{grid-template-columns:78px minmax(0,1fr)}.tags{min-height:112px}.hero{padding:9px}.hero h1{font-size:27px}.eyebrow{font-size:10px}.search{grid-column:1/-1}.search button{padding:0 13px}#map{height:74vh;min-height:520px}.legend-chip{font-size:10px}}
</style></head><body><div class="shell"><section class="top"><div class="tags"><img src="assets/approved-dog-tags.PNG" alt="Dog Tag Day dog tags"></div><div class="hero"><div class="eyebrow">DOG TAG DAY • APRIL 18</div><h1>Across America</h1><div class="search"><input id="searchBox" autocomplete="off" placeholder="Search any city, street or ZIP code"><button id="searchBtn">SEARCH</button></div></div></section><div class="mapbox" style="position:relative"><div id="map"></div><div class="count" id="dotCount">Loading all bubbles…</div><div class="private">PRIVATE TEST</div><div class="legend-wrap"><span class="legend-chip"><span class="sw" style="background:#2684ff"></span>VFW</span><span class="legend-chip"><span class="sw" style="background:#ff3f83"></span>American Legion</span><span class="legend-chip"><span class="sw" style="background:#9b59ff"></span>DAV</span><span class="legend-chip"><span class="sw" style="background:#1bc7c9"></span>VA</span><span class="legend-chip"><span class="sw" style="background:#ff9b24"></span>Veteran org</span></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{minZoom:3,maxZoom:19,zoomControl:true,preferCanvas:true,touchZoom:true,scrollWheelZoom:true,doubleClickZoom:true}).setView([39.5,-98.35],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map),colors={vfw:'#2684ff',legion:'#ff3f83',dav:'#9b59ff',va:'#1bc7c9',other:'#ff9b24'},added=new Set();let totalDots=0;function classify(name=''){const s=name.toLowerCase();if(s.includes('vfw')||s.includes('veterans of foreign wars'))return'vfw';if(s.includes('american legion'))return'legion';if(s.includes('disabled american veterans')||/^dav\b/.test(s))return'dav';if(s.includes('va medical')||s.includes('veterans affairs')||s.includes('veterans health'))return'va';return'other'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function addDot(lat,lng,name,type){const key=name+'|'+Number(lat).toFixed(4)+'|'+Number(lng).toFixed(4);if(added.has(key))return;added.add(key);L.circleMarker([lat,lng],{radius:2.2,color:colors[type]||colors.other,weight:.25,fillColor:colors[type]||colors.other,fillOpacity:.96}).addTo(layer).bindPopup('<strong>'+esc(name)+'</strong>');totalDots++;document.getElementById('dotCount').textContent=totalDots+' bubbles loaded'}function parseElements(data){(data.elements||[]).forEach(e=>{const name=e.tags&&e.tags.name;if(!name)return;const lat=e.lat??(e.center&&e.center.lat),lng=e.lon??(e.center&&e.center.lon);if(lat==null||lng==null)return;addDot(lat,lng,name,classify(name))})}async function queryBox(s,w,n,e){const bbox=`${s},${w},${n},${e}`,q=`[out:json][timeout:35];(nwr[\"name\"~\"VFW|Veterans of Foreign Wars|American Legion|Disabled American Veterans|DAV|Veterans Affairs|VA Medical|Veterans Health|Veterans Center|Veteran Center\",i](${bbox}););out center tags;`,endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];for(const url of endpoints){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(!r.ok)continue;parseElements(await r.json());return true}catch(err){}}return false}async function loadNationwide(){document.getElementById('dotCount').textContent='Loading all bubbles…';const boxes=[[24.4,-125,37.5,-100],[37.5,-125,50,-100],[24.4,-100,37.5,-66.5],[37.5,-100,50,-66.5],[51,-170,72,-129],[18.8,-161,22.6,-154]];let ok=0;for(const b of boxes){if(await queryBox(...b))ok++}document.getElementById('dotCount').textContent=totalDots+' bubbles loaded';if(ok===0)document.getElementById('dotCount').textContent='Map service busy — refresh'}let timer,last='';async function loadVisible(){if(map.getZoom()<10)return;const b=map.getBounds(),key=[b.getSouth().toFixed(2),b.getWest().toFixed(2),b.getNorth().toFixed(2),b.getEast().toFixed(2)].join(',');if(key===last)return;last=key;await queryBox(b.getSouth(),b.getWest(),b.getNorth(),b.getEast())}map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(loadVisible,350)});async function search(){const q=document.getElementById('searchBox').value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q));const a=await r.json();if(a.length)map.flyTo([+a[0].lat,+a[0].lon],15,{duration:1.1})}catch(e){}}document.getElementById('searchBtn').onclick=search;document.getElementById('searchBox').onkeydown=e=>{if(e.key==='Enter')search()};loadNationwide();</script></body></html>
