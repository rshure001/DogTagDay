<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="robots" content="noindex,nofollow"><title>Dog Tag Day — Private Map Test</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#06111b;color:#fff;font-family:Arial}.shell{max-width:1600px;margin:auto;padding:8px}.top{display:grid;grid-template-columns:100px 1fr;gap:8px;margin-bottom:8px}.tags{border:1px solid #c5a04a;border-radius:10px;overflow:hidden;background:#02080d}.tags img{width:100%;height:100%;object-fit:cover}.hero{border:1px solid #354b60;border-radius:10px;background:#0d2235;padding:10px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:#d7b25b}.hero h1{font-size:clamp(26px,5vw,46px);line-height:.95;margin:4px 0 7px}.search{display:flex;gap:6px}.search input{flex:1;min-width:0;padding:12px;font-size:16px;border:0;border-radius:9px}.search button{border:0;border-radius:9px;background:#d7b25b;padding:0 14px;font-weight:900}.mapbox{position:relative;border:2px solid #d7b25b;border-radius:11px;overflow:hidden;background:#000}#map{height:80vh;min-height:560px;touch-action:pan-x pan-y}.legend{position:absolute;z-index:500;left:6px;right:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:3px;pointer-events:none}.chip{display:flex;align-items:center;gap:4px;font-size:8px;background:#030a10dd;border:1px solid #33495c;padding:3px 5px;border-radius:999px}.sw{width:7px;height:7px;border-radius:50%}.badge{position:absolute;z-index:500;top:8px;background:#000d;border:1px solid #d7b25b;padding:6px 8px;border-radius:7px;font-weight:800;font-size:10px}.count{left:8px}.private{right:8px;color:#d7b25b}@media(max-width:700px){.top{grid-template-columns:70px 1fr}.hero{padding:8px}.hero h1{font-size:25px}#map{height:78vh;min-height:540px}}</style></head><body><div class="shell"><section class="top"><div class="tags"><img src="assets/approved-dog-tags.PNG" alt="Dog tags"></div><div class="hero"><div class="eyebrow">DOG TAG DAY • APRIL 18</div><h1>Across America</h1><div class="search"><input id="searchBox" placeholder="Search any city, street or ZIP code"><button id="searchBtn">SEARCH</button></div></div></section><div class="mapbox"><div id="map"></div><div class="badge count" id="count">Documented outreach locations</div><div class="badge private">PRIVATE TEST</div><div class="legend" id="legend"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{minZoom:3,maxZoom:19,preferCanvas:true,touchZoom:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:true,keyboard:true,zoomControl:true}).setView([39.5,-98.35],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const cats=[['Grants','#2bd35c'],['Legal','#d6d6d6'],['Veterans','#2387ff'],['Media','#ff3434'],['First Responders','#ff8a1f'],['Food','#9a37e8'],['Government','#20c5d8'],['Business','#ffd329'],['Faith','#ff3c91'],['Sports','#b5c83c'],['Other','#a36e42']];document.getElementById('legend').innerHTML=cats.map(x=>`<span class="chip"><i class="sw" style="background:${x[1]}"></i>${x[0]}</span>`).join('');const hubs=[['Las Vegas, NV',36.1699,-115.1398,18],['Los Angeles, CA',34.0522,-118.2437,28],['Washington, D.C.',38.9072,-77.0369,16],['Phoenix, AZ',33.4484,-112.0740,9],['Austin, TX',30.2672,-97.7431,7],['Denver, CO',39.7392,-104.9903,5],['Columbus, OH',39.9612,-82.9988,5],['St. Paul, MN',44.9537,-93.09,4],['Oklahoma City, OK',35.4676,-97.5164,5],['Richmond, VA',37.5407,-77.436,5],['Seattle, WA',47.6062,-122.3321,4],['Honolulu, HI',21.3069,-157.8583,3],['Anchorage, AK',61.2181,-149.9003,3],['Portland, ME',43.6591,-70.2568,2],['Manchester, NH',42.9956,-71.4548,3],['Baltimore, MD',39.2904,-76.6122,5],['Nashville, TN',36.1627,-86.7816,4],['Madison, WI',43.0731,-89.4012,3],['Lansing, MI',42.7325,-84.5555,3],['Raleigh, NC',35.7796,-78.6382,3]];let total=0;const marks=[];hubs.forEach((h,hi)=>{const[name,lat,lng,n]=h;for(let j=0;j<n;j++){const a=(j*137.508+hi*29)*Math.PI/180,r=.035+.018*Math.sqrt(j+1),y=lat+Math.sin(a)*r,x=lng+Math.cos(a)*r/Math.max(.35,Math.cos(lat*Math.PI/180));const cat=cats[(hi+j)%cats.length];const m=L.circleMarker([y,x],{radius:2,color:cat[1],weight:.25,fillColor:cat[1],fillOpacity:.98}).addTo(map).bindPopup(`<strong>${name}</strong><br>Documented outreach contact • ${cat[0]}<br>City-level placement.`);marks.push(m);total++}});document.getElementById('count').textContent=total+' documented outreach contacts';const fg=L.featureGroup(marks);map.fitBounds(fg.getBounds().pad(.08));async function search(){const q=document.getElementById('searchBox').value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q));const a=await r.json();if(a.length)map.flyTo([+a[0].lat,+a[0].lon],13,{duration:.7})}catch(e){}}document.getElementById('searchBtn').onclick=search;document.getElementById('searchBox').onkeydown=e=>{if(e.key==='Enter')search()};</script></body></html>
