<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Honor Jar | Dog Tag Day Foundation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#061421,#102e50);color:#fff;font-family:Arial,Helvetica,sans-serif}.card{width:min(560px,100%);padding:36px 24px;text-align:center;border:2px solid #dfba62;background:#07131f;box-shadow:inset 6px 0 #b62035,inset -6px 0 #143b68;border-radius:14px}h1{margin:0 0 14px;font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.4rem)}p{color:#dce5ef;line-height:1.6}.eyebrow{color:#dfba62;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.btn{display:inline-block;margin-top:12px;padding:14px 22px;border:2px solid #fff;border-radius:999px;background:#dfba62;color:#07131f;font-weight:900;cursor:pointer}.small{font-size:.82rem;color:#aebccb;margin-top:16px}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow">The Honor Jar</p>
<h1>Honor a Veteran Today</h1>
<p>Your gift will be completed securely on PayPal. Choose the button below to continue to PayPal.</p>
<a id="paypalDonate" class="btn" href="https://www.paypal.me/ronnieshure">Continue Directly to PayPal</a>
<p class="small">Secure payment is processed by PayPal. Dog Tag Day Foundation does not receive your card or bank login information.</p>
</main>
<script>
(function(){
  var raw=new URLSearchParams(window.location.search).get('amount');
  var n=Number(raw);
  if(Number.isFinite(n)&&n>=1){document.getElementById('paypalDonate').href='https://www.paypal.me/ronnieshure/'+n.toFixed(2)+'USD'}
})();
</script>
</body>
</html>
