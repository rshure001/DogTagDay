<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Approved Dog Tag Day military dog tag design</title>
<desc id="desc">Two military dog tags: one on a long beaded chain and a second on a short beaded chain attached to the long chain.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1425"/><stop offset=".55" stop-color="#101925"/><stop offset="1" stop-color="#05070b"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8f9"/><stop offset=".18" stop-color="#9ba2a9"/><stop offset=".42" stop-color="#e7eaed"/><stop offset=".68" stop-color="#747b82"/><stop offset=".9" stop-color="#d9dde0"/><stop offset="1" stop-color="#8b9299"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="12" cy="17" r="1" fill="#fff" opacity=".08"/><circle cx="49" cy="31" r=".8" fill="#fff" opacity=".07"/><circle cx="68" cy="66" r="1" fill="#000" opacity=".12"/></pattern>
</defs>
<rect width="1000" height="900" rx="40" fill="url(#bg)"/>
<ellipse cx="610" cy="390" rx="310" ry="260" fill="#b1122c" opacity=".12" filter="url(#glow)"/>
<ellipse cx="310" cy="320" rx="230" ry="210" fill="#224c84" opacity=".16" filter="url(#glow)"/>
<!-- long beaded chain -->
<path d="M125 70 C60 250 90 475 255 650 C350 750 510 790 660 708 C778 644 854 515 862 352 C870 205 802 96 700 54" fill="none" stroke="#d7dbe0" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 21"/>
<path d="M125 70 C60 250 90 475 255 650 C350 750 510 790 660 708 C778 644 854 515 862 352 C870 205 802 96 700 54" fill="none" stroke="#4e555d" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 21" opacity=".8"/>
<!-- connector point and short chain -->
<circle cx="568" cy="716" r="14" fill="#cfd4d8" stroke="#555d65" stroke-width="4"/>
<path d="M568 716 C625 650 688 620 752 620" fill="none" stroke="#d7dbe0" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 21"/>
<path d="M568 716 C625 650 688 620 752 620" fill="none" stroke="#4e555d" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 21" opacity=".8"/>
<!-- rear tag -->
<g transform="translate(485 290) rotate(-8)" filter="url(#shadow)">
  <path d="M55 0 H325 Q355 0 370 30 L396 92 Q405 114 392 137 L371 174 Q355 202 323 202 H55 Q18 202 0 166 V36 Q18 0 55 0Z" fill="url(#steel)" stroke="#3f454b" stroke-width="6"/>
  <path d="M55 0 H325 Q355 0 370 30 L396 92 Q405 114 392 137 L371 174 Q355 202 323 202 H55 Q18 202 0 166 V36 Q18 0 55 0Z" fill="url(#grain)"/>
  <circle cx="57" cy="101" r="25" fill="#15191d" stroke="#a5abb0" stroke-width="6"/>
  <text x="112" y="68" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#22282d">DOG TAG DAY</text>
  <text x="112" y="113" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#22282d">APRIL 18</text>
  <text x="112" y="157" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#30363b">HONOR • SERVICE • STORY</text>
</g>
<!-- front tag -->
<g transform="translate(185 448) rotate(10)" filter="url(#shadow)">
  <path d="M55 0 H325 Q355 0 370 30 L396 92 Q405 114 392 137 L371 174 Q355 202 323 202 H55 Q18 202 0 166 V36 Q18 0 55 0Z" fill="url(#steel)" stroke="#3f454b" stroke-width="6"/>
  <path d="M55 0 H325 Q355 0 370 30 L396 92 Q405 114 392 137 L371 174 Q355 202 323 202 H55 Q18 202 0 166 V36 Q18 0 55 0Z" fill="url(#grain)"/>
  <circle cx="57" cy="101" r="25" fill="#15191d" stroke="#a5abb0" stroke-width="6"/>
  <text x="112" y="60" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#22282d">WEAR YOUR TAGS</text>
  <text x="112" y="105" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#22282d">TELL YOUR STORY</text>
  <text x="112" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#22282d">HONOR OURS</text>
</g>
</svg>
