,[35,66],[31,60],[27,62],[24,57],[20,56],[17,52],[13,50],[10,46],[8,40],[6,34],[4,28],[3,21]];function inside(x,y){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}const box=document.getElementById('lights');const hubs=[[8,36],[13,22],[16,49],[23,48],[31,48],[39,50],[48,45],[57,47],[64,38],[70,33],[74,47],[79,43],[84,34],[88,27],[91,39],[83,54],[78,58],[67,52],[55,34],[45,29]];let n=0;while(n<1800){let use=R()<.62,x,y;if(use){let h=hubs[Math.floor(R()*hubs.length)];x=h[0]+(R()+R()+R()-1.5)*8;y=h[1]+(R()+R()+R()-1.5)*7}else{x=2+R()*94;y=9+R()*69}if(!inside(x,y))continue;let d=document.createElement('i'),q=R();d.className='dot '+(q<.18?'r':q<.25?'g':q<.29?'b':q<.32?'p':q<.48?'w':'');d.style.left=x+'%';d.style.top=y+'%';let z=.85+R()*1.8;if(q<.18)z*=1.25;d.style.width=z+'px';d.style.height=z+'px';box.appendChild(d);n++}hubs.forEach((h,i)=>{let d=document.createElement('i');d.className='hot';d.style.left=h[0]+'%';d.style.top=h[1]+'%';let z=(i%4===0?5:3.5);d.style.width=z+'px';d.style.height=z+'px';box.appendChild(d)});</script></body></html>
