<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Your Story | Dog Tag Day Foundation</title><style>
      .approved-stories {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 22px 72px;
      }
      .approved-stories h1 {
        font:
          900 clamp(2.4rem, 6vw, 4.6rem)/1.03 Georgia,
          serif;
        margin: 0.1em 0 0.25em;
      }
      .approved-stories .intro {
        color: #c6ced6;
        margin-bottom: 30px;
      }
      .story-card {
        padding: 30px;
        margin: 22px 0;
        background: linear-gradient(145deg, #172a3f, #0a1725);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-top: 4px solid #d7b464;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }
      .story-card p {
        white-space: pre-line;
        line-height: 1.65;
        color: #c6ced6;
      }
      .story-card .byline {
        font-weight: 700;
        color: #d7b464;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 28px;
        color: #d7b464;
        font-weight: 900;
      }
      .share-section { scroll-margin-top: 24px; margin-top: 60px; }
      .share-photo { display: block; width: 100%; max-height: 480px; object-fit: cover; object-position: center; border: 1px solid #d7b464; }
      .share-kicker { display: block; margin: 22px 0 7px; color: #e3bf62; font-size: .82rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
      .share-title { font: 900 clamp(2.35rem, 5.5vw, 4.25rem)/1 Georgia, serif; margin: 0 0 10px; }
      .share-intro { color: #c6ced6; margin: 0 0 22px; }
      .form-shell { margin: 0; padding: 28px; background: #102d43; border: 1px solid #e3b72f; border-radius: 12px; }
      .form-shell input[type="text"], .form-shell textarea { display: block; width: 100%; box-sizing: border-box; margin: 0 0 14px; padding: 17px 14px; border: 0; border-radius: 7px; background: #fff; color: #142331; font: inherit; }
      .form-shell textarea { min-height: 180px; resize: vertical; }
      .permission-row { display: flex; align-items: flex-start; gap: 12px; margin: 8px 0 22px; color: #fff; font-weight: 700; line-height: 1.35; }
      .permission-row input { appearance: none; flex: 0 0 24px; width: 24px; height: 24px; margin: 0; border: 2px solid #e3b72f; border-radius: 4px; background: #fff; }
      .permission-row input:checked { background: #d91f43; box-shadow: inset 0 0 0 5px #fff; }
      .form-shell .button { width: 100%; min-height: 52px; margin: 0; font-weight: 900; text-transform: uppercase; }
      .publish-note { margin: 17px 6px 0; color: #c6ced6; font-size: .85rem; }
      @media (max-width: 600px) {
        .approved-stories {
          padding: 34px 16px 60px;
        }
        .story-card {
          padding: 22px 18px;
        }
        .share-section { margin-top: 46px; }
        .share-photo { max-height: 260px; }
        .form-shell { padding: 18px 14px; }
        .form-shell textarea { min-height: 170px; }
      }
    </style></head><body><header><a href="index.html">DOG TAG DAY FOUNDATION</a></header><main><section class="share-section" id="share-story">
        <span class="share-kicker">Share the story behind the tags</span>
        <h2 class="share-title">Tell your story.</h2>
        <p class="share-intro">Help America see the person behind the service.</p>
        <form class="form-shell" id="dogtag-story-form">
          <input name="name" type="text" placeholder="Your name" required />
          <input name="connection" type="text" placeholder="Connection to military service" />
          <textarea name="message" rows="6" placeholder="Your story" required></textarea>
          <label class="permission-row">
            <input type="checkbox" name="permission" value="yes" required />
            <span>I give Dog Tag Day Foundation permission to publish my submission and contact me about it.</span>
          </label>
          <button class="button primary" type="submit">Publish My Story</button>
          <p class="publish-note">Nothing publishes until you tap this button.</p>
        </form>
      </section></main><footer><div class="footer-brand">DOG TAG DAY FOUNDATION</div><div>Official Date: April 18<br>© 2026 Dog Tag Day Foundation</div></footer><script src="story-wall-v2.js?v=20260830autopublish1"></script></body></html>
