<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dog Tag Day Story Review</title><link rel="stylesheet" href="styles.css"><style>body{font-family:Arial,sans-serif;background:#07111b;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.panel{background:#101c29;border:1px solid #34495e;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:12px;border-radius:8px;border:1px solid #777}button{padding:11px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.approve{background:#d9b45a;color:#07111b}.reject{background:#7f1d1d;color:#fff}.muted{opacity:.8}.story{white-space:pre-wrap;line-height:1.45}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.count{font-weight:800;color:#d9b45a}@media(max-width:600px){.wrap{padding:14px}.top{display:block}}</style></head><body><main class="wrap"><div class="top"><div><h1>Story Review</h1><p class="muted">Private moderation for Dog Tag Day Foundation.</p></div><a href="index.html" style="color:#d9b45a">Back to site</a></div><div class="panel"><div class="row"><input id="key" type="password" autocomplete="off" placeholder="Review access key"><button class="approve" id="open">Open Pending Stories</button></div><p id="status" class="muted">Enter the private review key.</p></div><div id="list"></div></main><script>(()=>{const endpoint='https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/story-wall';const key=document.getElementById('key'),list=document.getElementById('list'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=sessionStorage.getItem('dtdReviewKey');if(saved)key.value=saved;async function load(){const token=key.value.trim();if(!token){status.textContent='Enter the private review key.';return;}status.textContent='Loading…';list.innerHTML='';try{const r=await fetch(endpoint+'?admin=pending',{headers:{'x-admin-token':token},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load');sessionStorage.setItem('dtdReviewKey',token);status.innerHTML='<span class="count">'+d.stories.length+'</span> pending '+(d.stories.length===1?'story':'stories');if(!d.stories.length){list.innerHTML='<div class="panel"><strong>No stories are waiting for review.</strong></div>';return;}list.innerHTML=d.stories.map(s=>`<article class="panel" data-id="${s.id}"><h2>${esc(s.name||'Anonymous')}</h2>${s.connection?`<p><strong>${esc(s.connection)}</strong></p>`:''}<p class="story">${esc(s.message||'')}</p><p class="muted">Submitted ${new Date(s.created_at).toLocaleString()}</p><div class="row"><button class="approve" data-act="approve">Approve & Publish</button><button class="reject" data-act="reject">Reject</button></div></article>`).join('');}catch(e){status.textContent='Access denied or unable to load pending stories.';}}async function moderate(card,action){const token=key.value.trim();const id=Number(card.dataset.id);const btns=card.querySelectorAll('button');btns.forEach(b=>b.disabled=true);try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({action,id})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to update');card.remove();load();}catch(e){btns.forEach(b=>b.disabled=false);alert('Could not update this story.');}}document.getElementById('open').addEventListener('click',load);list.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const card=b.closest('[data-id]');if(card)moderate(card,b.dataset.act);});if(saved)load();})();</script></body></html>
