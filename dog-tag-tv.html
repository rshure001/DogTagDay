<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Dog Tag Day TV</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font:16px Arial,sans-serif}main{max-width:720px;margin:auto;padding:18px}.head,.card{background:#0d1c2f;border:1px solid #d9b75d;border-radius:14px;padding:16px;margin-bottom:14px}.brand{color:#d9b75d;font-weight:900;font-size:13px;letter-spacing:.1em}h1{margin:8px 0}.muted{color:#c5cfda;line-height:1.5}.value{font-size:22px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{padding:10px;border:1px solid #496079;border-radius:10px}.ok{border-color:#65c18c}.bad{border-color:#d86b79}button{width:100%;padding:14px;border:0;border-radius:10px;background:#d9b75d;color:#071426;font-weight:900;font-size:16px}small{color:#9eabba}</style></head><body><main><section class="head"><div class="brand">DOG TAG DAY FOUNDATION • OWNED CONTROL</div><h1>Dog Tag Day TV</h1><div class="muted">Standalone mobile control screen. It reads your existing control system directly.</div></section><section class="card"><div class="muted">CURRENT ROTATION</div><div id="rotation" class="value">Loading…</div><small id="time"></small></section><section class="card"><div class="muted">PLATFORM AUTHORIZATION</div><div id="platforms" class="grid">Loading…</div></section><section class="card"><div class="muted">COMMERCIALS</div><div id="queue">Loading…</div></section><section class="card"><button onclick="load()">REFRESH STATUS</button></section></main><script>const API="https://ynleeweezwkdbisaiovq.supabase.co/functions/v1/dogtag-control/api/status";function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}async function load(){try{const r=await fetch(API,{cache:"no-store"});const d=await r.json();document.getElementById("rotation").textContent=(d.rotation?.commercial||"—").replace("commercial-","Commercial #");document.getElementById("time").textContent=d.rotation?.localTime+" • America/Los_Angeles";document.getElementById("platforms").innerHTML=(d.platforms||[]).map(p=>'<div class="pill '+(p.authorized?'ok':'bad')+'"><b>'+esc(p.platform)+'</b><br>'+esc(p.authorized?'AUTHORIZED':p.last_status||'NOT AUTHORIZED')+'</div>').join("");document.getElementById("queue").innerHTML=(d.queue||[]).filter(q=>q.enabled).map(q=>'<div class="pill" style="margin-top:8px"><b>'+esc(q.label)+'</b><br><small>Enabled</small></div>').join("")||"No enabled commercials";}catch(e){document.getElementById("rotation").textContent="Connection error";document.getElementById("time").textContent="The control API could not be reached.";}}load();</script></body></html>
