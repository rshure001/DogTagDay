 beautiful and approximate.</small></div></div><a class="home" href="index.html">Dog Tag Day Home</a><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{minZoom:2,maxZoom:19,zoomControl:true,preferCanvas:false,worldCopyJump:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function amberWave(base,phase){const pts=[];for(let lon=-124;lon<=-68;lon+=.7)pts.push([base+Math.sin((lon+phase)*.42)*.5,lon]);L.polyline(pts,{color:'#ff9d24',weight:10,opacity:.04,interactive:false}).addTo(map);L.polyline(pts,{color:'#ffd45a',weight:2,opacity:.2,dashArray:'2 8',interactive:false}).addTo(map)}[31.7,35.2,38.7,42.2,45.5].forEach((lat,i)=>amberWave(lat,i*3.4));const C=['#ff3347','#2f8cff','#32e07a','#ffffff','#ffbd3b'];function icon(cls,color){return L.divIcon({className:'',html:'<div class="'+cls+'" style="color:'+color+';background:'+color+'"></div>',iconSize:cls==='hub'?[10,10]:[3,3],iconAnchor:cls==='hub'?[5,5]:[1.5,1.5]})}function hub(n,a,o){L.marker([a,o],{icon:icon('hub','#fff')}).addTo(map).bindTooltip(n)}function dot(a,o,c){L.marker([a,o],{icon:icon('light',c),interactive:false}).addTo(map)}const H=[['Seattle',47.61,-122.33,32],['Tacoma',47.25,-122.44,10],['Portland',45.52,-122.68,25],['Spokane',47.66,-117.43,10],['San Francisco',37.77,-122.42,38],['Sacramento',38.58,-121.49,22],['San Jose',37.34,-121.89,24],['Los Angeles',34.05,-118.24,70],['Riverside',33.98,-117.38,13],['San Diego',32.72,-117.16,32],['Fresno',36.74,-119.79,13],['Bakersfield',35.37,-119.02,11],['Las Vegas',36.17,-115.14,40],['Reno',39.53,-119.81,14],['Carson City',39.16,-119.77,6],['Phoenix',33.45,-112.07,43],['Tucson',32.22,-110.97,16],['Salt Lake City',40.76,-111.89,22],['Boise',43.62,-116.2,12],['Denver',39.74,-104.99,36],['Colorado Springs',38.83,-104.82,14],['Albuquerque',35.08,-106.65,17],['El Paso',31.76,-106.49,14],['Dallas',32.78,-96.8,4
