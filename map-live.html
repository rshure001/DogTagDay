<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Dog Tag Day | 3,211 Lights Across America</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#02060b;color:#fff;font-family:Arial,sans-serif}
    body{overflow-x:hidden;background:radial-gradient(circle at 50% 42%,#13202a 0,#07111a 42%,#02060b 78%)}
    .head{margin:12px;border:1px solid #d7b464;border-radius:14px;background:#02060bf2;padding:13px 15px;text-align:center;box-shadow:0 0 24px #d7a53b33}
    .head strong{display:block;color:#f8d26b;font-size:clamp(17px,4.4vw,28px);letter-spacing:.11em}
    .head .count{display:block;margin-top:5px;color:#fff7d1;font-size:clamp(15px,3.9vw,23px);font-weight:900}
    .head small{display:block;margin-top:4px;color:#dbe5ed;line-height:1.25}
    .map-shell{position:relative;width:100%;height:min(61vw,560px);min-height:310px;margin:8px auto 0;border-top:1px solid #8b7138;border-bottom:1px solid #8b7138;background:#02060b;box-shadow:inset 0 0 55px #000,0 0 36px #d7a53b22}
    #map{width:100%;height:100%;background:#02060b}
    .leaflet-container{background:#02060b;cursor:default!important}
    .leaflet-tile-pane{filter:brightness(.13) saturate(.28) contrast(2.25)}
    .leaflet-control-attribution{font-size:7px!important;opacity:.55;background:#000a!important;color:#b9c5ce!important}
    .leaflet-control-attribution a{color:#d7b464!important}
    .spark{width:8px;height:8px;border-radius:50%;background:#fffbd8;box-shadow:0 0 4px 2px #fff,0 0 11px 5px #ffe19a,0 0 22px 10px #d89a36,0 0 38px 16px #b866174d}
    .vegas{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 6px 3px #fff,0 0 16px 8px #ffe36d,0 0 34px 15px #ff9b24,0 0 55px 25px #ff6b174d}
    .caption{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:13px 10px 22px;color:#eaf1f6;font-weight:700;text-align:center}
    .key{display:inline-flex;align-items:center;gap:5px}.bulb{width:9px;height:9px;border-radius:50%;box-shadow:0 0 6px currentColor,0 0 12px currentColor;background:currentColor}
    .home{display:block;width:max-content;margin:0 auto 22px;padding:9px 14px;border:1px solid #d7b464;border-radius:9px;color:#fff;text-decoration:none;background:#07111b}
    @media(max-width:600px){.head{margin:8px;padding:10px 8px}.head small{font-size:11px}.map-shell{height:66vw;min-height:295px}.caption{font-size:12px;padding-top:10px}.spark{width:7px;height:7px}}
  </style>
</head>
<body>
  <header class="head">
    <strong>AMERICA AGLOW FOR DOG TAG DAY</strong>
    <span class="count">3,211 LIGHTS ACROSS AMERICA</span>
    <small>Every light represents an outreach touchpoint. Repeat contacts remain as neighboring lights.</small>
  </header>
  <section class="map-shell" aria-label="United States lit with 3,211 outreach lights"><div id="map"></div></section>
  <div class="caption">
    <span class="key" style="color:#ff3b45"><i class="bulb"></i>Honor</span>
    <span class="key" style="color:#2d8cff"><i class="bulb"></i>Service</span>
    <span class="key" style="color:#38e875"><i class="bulb"></i>Community</span>
    <span class="key" style="color:#fff"><i class="bulb"></i>Remembrance</span>
    <span class="key" style="color:#ffbd45"><i class="bulb"></i>Amber waves</span>
  </div>
  <a class="home" href="index.html">Return to Dog Tag Day</a>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const m=L.map('map',{zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,preferCanvas:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:7,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
    let seed=4182026;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
    const outline=[[-124.8,48.8],[-124.2,42],[-117.1,32.5],[-111,31.3],[-106.5,31.8],[-103,29.7],[-99,26],[-96,26],[-94,29],[-90,29],[-85,30],[-82,25],[-80,26],[-80,32],[-77,35],[-76,39],[-74,40.5],[-70,42],[-69.8,44],[-72.5,45.2],[-79,43.5],[-83,46],[-89,47],[-95,49],[-110,49]];
    function inside(x,y){let c=false;for(let i=0,j=outline.length-1;i<outline.length;j=i++){const a=outline[i],b=outline[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
    const cities=[[47.61,-122.33],[45.52,-122.68],[37.77,-122.42],[38.58,-121.49],[36.17,-115.14],[34.05,-118.24],[32.72,-117.16],[33.45,-112.07],[40.76,-111.89],[39.74,-104.99],[32.78,-96.8],[29.76,-95.37],[30.27,-97.74],[29.42,-98.49],[35.47,-97.52],[39.1,-94.58],[38.63,-90.2],[44.98,-93.27],[41.88,-87.63],[42.33,-83.05],[39.96,-83],[39.77,-86.16],[36.16,-86.78],[35.15,-90.05],[33.75,-84.39],[30.33,-81.66],[28.54,-81.38],[27.95,-82.46],[25.76,-80.19],[35.23,-80.84],[35.78,-78.64],[37.54,-77.44],[38.91,-77.04],[39.29,-76.61],[39.95,-75.17],[40.71,-74.01],[42.36,-71.06],[41.82,-71.41],[42.89,-78.88],[40.44,-79.99],[38.25,-85.76],[33.52,-86.81],[34.75,-92.29],[41.26,-95.93],[43.54,-96.73],[43.62,-116.2],[32.22,-110.97],[31.76,-106.49],[38.83,-104.82],[36.15,-95.99],[37.69,-97.33]];
    const points=[];
    while(points.length<1810){const x=-125+rnd()*59,y=24+rnd()*26;if(inside(x,y))points.push([y,x,0])}
    while(points.length<3111){const h=cities[Math.floor(rnd()*cities.length)],a=rnd()*Math.PI*2,d=.025+Math.sqrt(rnd())*.48;points.push([h[0]+Math.sin(a)*d,h[1]+Math.cos(a)*d/Math.max(.58,Math.cos(h[0]*Math.PI/180)),1])}
    for(let i=0;i<55;i++)points.push([58.5+rnd()*5.4,-152+rnd()*9,0]);
    for(let i=0;i<45;i++)points.push([19.2+rnd()*2.9,-160+rnd()*5,0]);
    points.length=3211;
    const colors=['#ff3347','#2f8cff','#37e876','#ffffff','#ffbd45','#fff4b0'];
    const cv=L.canvas({padding:.7,tolerance:0});
    points.forEach((p,i)=>{const c=colors[(i*7+i%5)%colors.length],radius=i%41===0?3.7:(p[2]?2.45:2.15);L.circleMarker([p[0],p[1]],{renderer:cv,radius,weight:i%41===0?1:.35,color:'#fff8d8',opacity:.95,fillColor:c,fillOpacity:1,interactive:false}).addTo(m)});
    cities.filter((_,i)=>i%3===0).forEach(([y,x])=>L.marker([y,x],{icon:L.divIcon({className:'',html:'<div class="spark"></div>',iconSize:[8,8],iconAnchor:[4,4]}),interactive:false}).addTo(m));
    L.marker([36.17,-115.14],{icon:L.divIcon({className:'',html:'<div class="vegas"></div>',iconSize:[12,12],iconAnchor:[6,6]}),interactive:false}).addTo(m);
    m.fitBounds([[23.5,-126],[50.5,-66]],{padding:[2,2],animate:false});
    window.addEventListener('resize',()=>{m.invalidateSize();m.fitBounds([[23.5,-126],[50.5,-66]],{padding:[2,2],animate:false})});
    window.DOGTAG_LIGHT_COUNT=points.length;document.body.dataset.lightCount=String(points.length);
  </script>
</body>
</html>
