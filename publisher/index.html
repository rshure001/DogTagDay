<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dog Tag Day Publisher</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#111;color:#fff;margin:0;padding:24px}main{max-width:680px;margin:0 auto}.card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:22px}h1{margin-top:0}label{display:block;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px}button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;font-weight:800;font-size:17px;cursor:pointer}#status{margin-top:16px;white-space:pre-wrap}small{color:#aaa}</style></head><body><main><div class="card"><h1>Dog Tag Day Publisher</h1><p>Direct Instagram publishing through Meta's official API.</p><label for="video">Commercial video URL</label><input id="video" type="url" value="https://static.metricool.com/planner/202609/6882844-file-7467803550847519649.mp4"><label for="caption">Caption</label><textarea id="caption">Dog Tag Day — April 18, 2027. Real people. Real support. Real change. Put them on. Acknowledge one. DogTagDay.org #DogTagDay #Veterans</textarea><button id="publish">Publish Commercial One</button><div id="status"></div><small>The Meta access token and Instagram account ID stay on the server and are never stored in this page.</small></div></main><script>const btn=document.getElementById('publish');const status=document.getElementById('status');btn.addEventListener('click',async()=>{btn.disabled=true;status.textContent='Publishing…';try{const r=await fetch('/api/instagram-publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({video_url:document.getElementById('video').value,caption:document.getElementById('caption').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Publish failed');status.textContent='Published successfully. Media ID: '+data.media_id}catch(e){status.textContent='Publish failed: '+e.message}finally{btn.disabled=false}});</script></body></html>
