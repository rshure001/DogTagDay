<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Tag Day | April 18</title>
  <meta name="description" content="Dog Tag Day honors veterans, active-duty service members, military families, and the stories behind every set of dog tags.">
  <style>
    :root{--navy:#07101c;--navy2:#0b1d33;--cream:#f4f1e9;--gold:#d4ad5c;--red:#d93a52;--paper:#f7f3e8;--ink:#111820;--line:rgba(255,255,255,.18)}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink)}
    a{text-decoration:none;color:inherit}
    .site-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 5vw;background:rgba(7,16,28,.96);color:#fff;border-bottom:1px solid var(--line)}
    .brand{font-family:Georgia,serif;font-weight:800;letter-spacing:.16em;font-size:1.15rem}
    .nav{display:flex;gap:22px;align-items:center;font-weight:700;font-size:.92rem}
    .nav a:hover{color:var(--gold)}
    .hero{min-height:78vh;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,560px);align-items:center;overflow:hidden;background:var(--navy)}
    .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.95) contrast(1.05)}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,28,.18) 0%,rgba(7,16,28,.30) 42%,rgba(7,16,28,.86) 68%,rgba(7,16,28,.96) 100%)}
    .hero-content{grid-column:2;position:relative;z-index:2;color:#fff;padding:70px 6vw 70px 30px;text-align:left}
    .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.86rem;font-weight:800;color:#f3e9cb}
    h1{font-family:Georgia,serif;font-size:clamp(3.6rem,8vw,7.4rem);line-height:.84;margin:.18em 0 .14em;letter-spacing:.02em}

    .tagline{font-size:1.22rem;margin:20px 0 28px;color:#f7f3e8}

    .btn{display:inline-block;padding:15px 24px;border:2px solid #fff;font-weight:900;letter-spacing:.04em}
