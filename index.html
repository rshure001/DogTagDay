<!doctype html>
<html lang="en" data-dtd-build="2026-09-16-six-page-upswipe-v1">
<head>

<title>Dog Tag Day | April 18</title>
<style>
:root{--navy:#06101f;--gold:#d9b75d;--blue:#123f75}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02070d;color:#fff;font-family:Arial,Helvetica,sans-serif}.app{height:100svh;display:flex;flex-direction:column;background:#06101f}.top{min-height:82px;padding:calc(12px + env(safe-area-inset-top)) 20px 10px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:flex-end}.brand{font-weight:900;letter-spacing:.16em}.brand small{display:block;color:var(--gold);font-size:.72rem;letter-spacing:.2em;margin-top:5px}.count{color:var(--gold);font-weight:900}.viewport{position:relative;flex:1;overflow:hidden;touch-action:none}.track{height:100%;transition:transform .34s ease;will-change:transform}.page{height:100%;display:flex;align-items:center;justify-content:center;padding:14px 12px 84px}.sheet{position:relative;width:min(920px,100%);height:100%;background:#081727;border:2px solid var(--gold);box-shadow:0 0 0 4px #173f70,0 18px 45px #000b;overflow:hidden}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#06101f}.curl{position:absolute;right:0;bottom:0;width:118px;height:118px;background:linear-gradient(135deg,transparent 48%,#fff 49% 64%,#d9b75d 65% 80%,#123f75 81%);filter:drop-shadow(-8px -8px 12px #0007);pointer-events:none}.curl:after{content:'SWIPE\A UP';white-space:pre;position:absolute;right:12px;bottom:12px;color:#06101f;font-weight:900;font-size:.8rem;text-align:center;transform:rotate(-8deg)}.controls{position:absolute;left:0;right:0;bottom:0;height:76px;display:flex;justify-content:center;align-items:center;gap:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#06101f 45%);z-index:5}.dot{width:10px;height:10px;border-radius:50%;background:#718096}.dot.on{width:34px;border-radius:999px;background:var(--gold)}.hint{position:absolute;right:18px;top:18px;background:#06101fcc;border:1px solid var(--gold);color:#fff;padding:7px 10px;border-radius:999px;font-weight:800;font-size:.72rem;z-index:4}@media(max-width:430px){.page{padding:10px 8px 78px}.sheet{border-width:1px}.curl{width:96px;height:96px}.curl:after{font-size:.7rem}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">DOG TAG DAY<small>APRIL 18</small></div><div class="count" id="count">1 / 6</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">

<section class="page"><div class="sheet"><img src="https://gcdn.picsart.com/editing-temp/5b0765b7-72b7-4141-a33a-80511fd45147.png" alt="Dog Tag Day page 2"><div class="curl"></div></div></section>
<section class="page"><div class="sheet"><img src="https://gcdn.picsart.com/editing-temp/4af652f2-2d8d-433a-94f8-6ed65322401a.png" alt="Dog Tag Day page 3"><div class="curl"></div></div></section>
<section class="page"><div class="sheet"><img src="https://gcdn.picsart.com/editing-temp/a1225c65-0e05-469b-a2c3-5b140edba442.png" alt="Dog Tag Day page 4"><div class="curl"></div></div></section>
<section class="page"><div class="sheet"><img src="https://gcdn.picsart.com/editing-temp/9d05a57c-a097-40cf-b07d-fccc176fc976.png" alt="Dog Tag Day page 5"><div class="curl"></div></div></section>
<section class="page"><div class="sheet"><img src="https://gcdn.picsart.com/editing-temp/fbccaa32-dfa5-4485-b2f9-9fa5fdc5d869.png" alt="Dog Tag Day page 6"><div class="curl"></div></div></section>
</div><div class="hint">Swipe up</div><div class="controls" id="dots"></div></div>
</div>
<script>
const track=document.getElementById('track'),vp=document.getElementById('viewport'),count=document.getElementById('count'),dots=document.getElementById('dots');let i=0,sy=0,dy=0;for(let n=0;n<6;n++){const d=document.createElement('span');d.className='dot';dots.appendChild(d)}function render(){track.style.transform=`translateY(${-i*100}%)`;count.textContent=`${i+1} / 6`;[...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i))}function go(n){i=Math.max(0,Math.min(5,n));render()}vp.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;dy=0},{passive:true});vp.addEventListener('touchmove',e=>{dy=e.touches[0].clientY-sy},{passive:true});vp.addEventListener('touchend',()=>{if(Math.abs(dy)>42)go(i+(dy<0?1:-1))});document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown')go(i+1);if(e.key==='ArrowUp'||e.key==='PageUp')go(i-1)});render();
</script>
</body></html>
